# Runs in every build through the "SwiftLint" build phase. Fix the code instead of disabling a rule;
# a disable needs a comment saying why.
included:
  - BelloHub
  - BelloHubTests
  - BelloHubUITests
excluded:
  - build
  # Generated by scripts/fetch-wordlist.sh: 2048 words in one literal.
  - BelloHub/Managers/Vault/Bip39Wordlist.swift

opt_in_rules:
  - empty_count
  - sorted_imports

identifier_name:
  # The Palette tokens are short on purpose (bg, ink, ink2).
  min_length: 2
