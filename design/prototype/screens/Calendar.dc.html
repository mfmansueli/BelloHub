<style>
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#242321;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}

@keyframes mPop{0%{transform:scale(.45);opacity:0}58%{transform:scale(1.09);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mSheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes mDrift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(6%,5%,0) scale(1.12)}}
@keyframes mDot{0%{box-shadow:0 0 0 0 rgba(201,143,159,.6)}70%{box-shadow:0 0 0 8px rgba(201,143,159,0)}100%{box-shadow:0 0 0 0 rgba(201,143,159,0)}}
button,a{-webkit-tap-highlight-color:transparent;transition:transform .24s var(--ease),background-color .24s ease,color .24s ease,border-color .24s ease,box-shadow .3s ease,opacity .24s ease,filter .24s ease}
button:active,a:active{transform:scale(.97)}
button[style*="width:100%"]:active,a[style*="width:100%"]:active,a[style*="display:flex"]:active{transform:scale(.985)}
.m-scrim:active{transform:none}
@media (hover:hover){
button:hover,a:hover{filter:brightness(.975)}
button[style*="background:#242321"]:hover,a[style*="background:#242321"]:hover{filter:brightness(1.22)}
}
button[role="switch"]{transition:background-color .3s var(--ease),transform .2s var(--ease)}
button[role="switch"]>span{transition:left .34s var(--soft),box-shadow .3s ease}
button[role="switch"][aria-checked="true"]>span{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.0)}
.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}
.m-scrim{animation:mFade .28s ease backwards;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>

ze:15px;font-weight:600;text-align:center;background:{{weekBg}};box-shadow:{{weekShadow}}">Week</button></div></div><div style="display:flex;justify-content:space-between;padding-bottom:12px"><sc-for list="{{strip}}" as="d" hint-placeholder-count="7"><button onClick="{{d.pick}}" aria-label="{{d.aria}}" style="width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center"><span style="font-size:12px;color:#65625D;font-weight:500">{{d.dow}}</span><span style="width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;background:{{d.bg}};color:{{d.fg}}">{{d.num}}</span></button></sc-for></div></div><div class="noscroll" style="position:absolute;inset:0;overflow-y:auto;padding:262px 0 112px"><sc-if value="{{isDay}}" hint-placeholder-val="{{true}}"><div style="position:relative;height:720px;margin:0 20px 0 0"><sc-for list="{{hours}}" as="h" hint-placeholder-count="12"><div style="position:absolute;left:0;right:0;top:{{h.top}}px;height:60px"><div class="tn" style="position:absolute;left:0;top:-8px;width:56px;text-align:right;padding-right:10px;font-size:12px;color:#65625D">{{h.label}}</div><div style="position:absolute;left:62px;right:0;top:0;height:1px;background:#EAE5DC"></div></div></sc-for><div style="position:absolute;left:68px;right:0;top:360px;height:60px;border-radius:14px;background:#EFEBE4;display:flex;align-items:center;padding:0 12px;font-size:13px;color:#65625D">Lunch · 12:30 to 13:30</div><sc-for list="{{blocks}}" as="b" hint-placeholder-count="3"><a href="Appointment.dc.html" style="position:absolute;left:68px;right:0;top:{{b.top}}px;height:{{b.h}}px;border-radius:16px;padding:9px 12px;background:{{b.bg}};color:{{b.fg}};overflow:hidden;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);border-left:4px solid {{b.bar}}"><div class="tn" style="font-size:12px;font-weight:600;opacity:.85">{{b.range}}</div><div style="font-size:15px;font-weight:600;margin-top:1px">{{b.name}}</div><div style="font-size:13px;opacity:.9">{{b.svc}}</div></a></sc-for><div style="position:absolute;left:56px;right:0;top:{{nowTop}}px;height:2px;background:#C98F9F"><div style="position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:#C98F9F"></div></div></div></sc-if><sc-if value="{{isWeek}}" hint-placeholder-val="{{false}}"><div style="position:relative;height:432px;margin:0 20px"><sc-for list="{{whours}}" as="h" hint-placeholder-count="12"><div style="position:absolute;left:0;right:0;top:{{h.top}}px;height:1px;background:#EAE5DC"><div class="tn" style="position:absolute;left:0;top:-8px;width:34px;font-size:12px;color:#65625D;background:#F8F6F2">{{h.label}}</div></div></sc-for><sc-for list="{{wblocks}}" as="b" hint-placeholder-count="10"><a href="Appointment.dc.html" aria-label="{{b.ini}}" style="position:absolute;left:{{b.left}}px;width:41px;top:{{b.top}}px;height:{{b.h}}px;border-radius:9px;background:{{b.bg}};color:{{b.fg}};font-size:12px;font-weight:700;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;overflow:hidden">{{b.ini}}</a></sc-for><a href="Waitlist.dc.html" aria-label="Open slot Thursday 15:00" style="position:absolute;left:{{freeLeft}}px;width:41px;top:{{freeTop}}px;height:54px;border-radius:9px;border:1.5px dashed #C98F9F;background:#FBF3F5;color:#9A5A6C;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a></div><div style="margin:18px 20px 0;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#65625D"><span style="width:10px;height:10px;border-radius:3px;background:#F4E6E9;border:1px solid #D9B3BE"></span>New booking from your link</div><a href="Waitlist.dc.html" style="display:flex;align-items:center;gap:12px;min-height:60px;padding:0 14px;border-radius:20px;background:#FBF3F5;border:1px solid #F0DCE1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A5A6C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span style="flex:1;font-size:15px;color:#5E3744"><b style="font-weight:600">Thu 15:00 is open.</b> 3 people are waiting.</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A5A6C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></a></div></sc-if></div><div style="position:absolute;left:0;right:0;bottom:0;z-index:3"><dc-import name="TabBar" active="calendar" hint-size="390px,84px"></dc-import></div></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sw = (on) => ({ on: on, bg: on ? '#6E8266' : '#D5D0C7', left: on ? '22px' : '2px' });
    const cs = (on) => ({ on: on, bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : '#242321', bd: on ? '#242321' : '#E3DED5' });

    const view = st.view || 'day'; const isDay = view === 'day'; const sel = st.sel === undefined ? 2 : st.sel;
    const labels = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];
    const hours = labels.map((l, i) => ({ label: l, top: i * 60 }));
    const whours = labels.map((l, i) => ({ label: l, top: i * 36 }));
    const dows = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']; const nums = [28, 29, 30, 1, 2, 3, 4];
    const strip = dows.map((d, i) => ({ dow: d, num: nums[i], aria: d + ' ' + nums[i], bg: i === sel ? '#242321' : (i === 2 ? '#EFEBE4' : 'transparent'), fg: i === sel ? '#FFFCF8' : (i === 6 ? '#8C8984' : '#242321'), pick: () => this.setState({ sel: i }) }));
    const done = { bg: '#ECE8E1', fg: '#4F4C47', bar: '#B5B0A7' }, conf = { bg: '#E8EEE2', fg: '#34452E', bar: '#6E8266' }, neu = { bg: '#F7E9EC', fg: '#6E3A4A', bar: '#C98F9F' };

      3: [{ top: 120, h: 60, range: '10:00 to 11:00', name: 'Larissa Souza', svc: 'Acne Treatment', ...conf }, { top: 420, h: 90, range: '15:00 to 16:30', name: 'Helena Duarte', svc: 'Brazilian Glow', ...neu }],
      0: [{ top: 120, h: 60, range: '10:00 to 11:00', name: 'Larissa Souza', svc: 'Acne Treatment', ...done }],
      1: [{ top: 60, h: 60, range: '09:00 to 10:00', name: 'Beatriz Lima', svc: 'Glow Facial', ...done }, { top: 180, h: 90, range: '11:00 to 12:30', name: 'Marina Alves', svc: 'Deep Cleansing', ...done }],
      4: [{ top: 60, h: 60, range: '09:00 to 10:00', name: 'Paula Nunes', svc: 'Glow Facial', ...conf }], 5: [{ top: 120, h: 90, range: '10:00 to 11:30', name: 'Marina Alves', svc: 'Deep Cleansing', ...conf }], 6: []
    };
    const col = (i) => 38 + i * 44;
    const wb = (day, startH, durMin, ini, s) => ({ left: col(day), top: (startH - 8) * 36, h: Math.max(24, durMin * 0.6), ini: ini, bg: s.bg, fg: s.fg });
    const wblocks = [wb(0, 10, 60, 'LS', done), wb(0, 14, 75, 'PN', done), wb(1, 9, 60, 'BL', done), wb(1, 11, 90, 'MA', done), wb(1, 15, 60, 'CR', done), wb(2, 9, 75, 'JM', done), wb(2, 11.5, 60, 'CR', conf), wb(2, 15, 90, 'AC', conf), wb(3, 10, 60, 'LS', conf), wb(4, 9, 60, 'PN', conf), wb(4, 13, 75, 'BL', conf), wb(5, 10, 90, 'MA', conf)];

    return { isDay, isWeek: !isDay, hours, whours, strip, blocks: byDay[sel] || [], wblocks, monthLabel: sel >= 3 && sel <= 6 ? 'October 2026' : 'September 2026', nowTop: 160, freeLeft: col(3), freeTop: 7 * 36 + 60,
      dayBg: isDay ? '#FFFCF8' : 'transparent', dayShadow: isDay ? '0 1px 3px rgba(36,35,33,.14)' : 'none', weekBg: isDay ? 'transparent' : '#FFFCF8', weekShadow: isDay ? 'none' : '0 1px 3px rgba(36,35,33,.14)',
      setDay: () => this.setState({ view: 'day' }), setWeek: () => this.setState({ view: 'week' }) };
  }
}
</script>
