<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First-time questions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#242321;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
textarea{border:0;outline:none;resize:none;width:100%;background:none;padding:0}
a{color:inherit;text-decoration:none}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.tn{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
a:focus-visible,button:focus-visible{outline:3px solid #9A5A6C;outline-offset:2px}
/*motion v1*/
@media (prefers-reduced-motion:no-preference){
:root{--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.3,1.25,.5,1)}
@keyframes mRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes mPop{0%{transform:scale(.45);opacity:0}58%{transform:scale(1.09);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mSheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes mDrift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(6%,5%,0) scale(1.12)}}
@keyframes mDot{0%{box-shadow:0 0 0 0 rgba(201,143,159,.6)}70%{box-shadow:0 0 0 8px rgba(201,143,159,0)}100%{box-shadow:0 0 0 0 rgba(201,143,159,0)}}
button,a{-webkit-tap-highlight-color:transparent;transition:transform .24s var(--ease),background-color .24s ease,color .24s ease,border-color .24s ease,box-shadow .3s ease,opacity .24s ease,filter .24s ease}
button:active,a:active{transform:scale(.97)}
button[style*="width:100%"]:active,a[style*="width:100%"]:active,a[style*="display:flex"]:active{transform:scale(.985)}
.m-scrim:active{transform:none}
@media (hover:hover){
button:hover,a:hover{filter:brightness(.975)}
button[style*="background:#242321"]:hover,a[style*="background:#242321"]:hover{filter:brightness(1.22)}
}
button[role="switch"]{transition:background-color .3s var(--ease),transform .2s var(--ease)}
button[role="switch"]>span{transition:left .34s var(--soft),box-shadow .3s ease}
button[role="switch"][aria-checked="true"]>span{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.0)}
.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}
.m-scrim{animation:mFade .28s ease backwards;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#F8F6F2;overflow:hidden">
<div class="noscroll" style="position:absolute;inset:0;overflow-y:auto;padding:62px 20px 240px">

<div style="display:flex;align-items:center;gap:12px;height:44px">
<a href="Bk-6-Verify.dc.html" aria-label="Back" style="width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg></a>
<div style="flex:1;display:flex;gap:6px"><div style="flex:1;height:4px;border-radius:2px;background:#242321"></div><div style="flex:1;height:4px;border-radius:2px;background:#242321"></div><div style="flex:1;height:4px;border-radius:2px;background:#242321"></div><div style="flex:1;height:4px;border-radius:2px;background:#242321"></div><div style="flex:1;height:4px;border-radius:2px;background:#242321"></div></div>
<span style="width:20px"></span>
</div>

<div style="margin-top:24px;font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:500;letter-spacing:-0.015em;line-height:1.1">Tell Maria a little about you.</div>
<div style="font-size:16px;color:#65625D;margin-top:8px;line-height:1.45">Optional. It helps your first Brazilian Glow feel made for you.</div>

<div style="margin-top:26px;font-size:17px;font-weight:600">What would you like to achieve?</div>
<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px">
<sc-for list="{{goals}}" as="g" hint-placeholder-count="4">
<button onClick="{{g.toggle}}" aria-pressed="{{g.on}}" style="height:48px;padding:0 18px;border-radius:24px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;background:{{g.bg}};color:{{g.fg}};border:1.5px solid {{g.bd}}">{{g.label}}</button>
</sc-for>
</div>

<div style="margin-top:28px;font-size:17px;font-weight:600">Have you had this treatment before?</div>
<div style="display:flex;background:#EAE6DF;border-radius:14px;padding:3px;margin-top:12px">
<sc-for list="{{before}}" as="b" hint-placeholder-count="2">
<button onClick="{{b.pick}}" aria-pressed="{{b.on}}" style="flex:1;height:44px;border-radius:11px;font-size:16px;font-weight:600;text-align:center;background:{{b.bg}};box-shadow:{{b.sh}}">{{b.label}}</button>
</sc-for>
</div>

<label for="pref" style="display:block;margin-top:28px;font-size:17px;font-weight:600">Any preferences your professional should know?</label>
<div style="margin-top:12px;border-radius:18px;background:#FFFCF8;border:1.5px solid #E3DED5;padding:14px 16px;height:104px"><textarea id="pref" placeholder="Allergies, products you avoid, how you like to be treated" style="font-size:16px;line-height:1.4;height:100%"></textarea></div>

</div>

<div style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 34px;background:rgba(255,252,248,0.96);border-top:1px solid #ECE7DF">
<div style="font-size:13px;line-height:1.4;color:#65625D;text-align:center;margin:0 4px 10px">{{agree}}</div>
<a href="Bk-8-Confirmed.dc.html" style="height:56px;border-radius:18px;background:#242321;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);color:#FFFCF8;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600">Confirm appointment</a>
<a href="Bk-8-Confirmed.dc.html" style="height:44px;margin-top:4px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#65625D">Skip for now</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const HSX = this.hubState || {}; const CP = HSX.CancelPolicy || {}; const NP = HSX.NoShowPolicy || {};
    const Q = { win: CP.win === undefined ? 24 : CP.win, selfRes: CP.selfRes === undefined ? true : CP.selfRes, resMax: CP.resMax === undefined ? 2 : CP.resMax,
      lateCancel: CP.lateCancel || 'allow', lateRes: CP.lateRes || 'request', remind: CP.remind === undefined ? true : CP.remind,
      nsOn: NP.on === undefined ? true : NP.on, nsLim: NP.lim === undefined ? 3 : NP.lim, nsAct: NP.act || 'approve', nsLate: !!NP.late,
      late: !!(this.props && this.props.timing === 'late') };
    Q.winT = Q.win + ' hours';
    const p2 = (n) => (n < 10 ? '0' : '') + n;
    const DN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], MN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const dl = new Date(new Date(2026, 9, 1, 15, 0).getTime() - Q.win * 3600000);
    Q.deadline = DN[dl.getDay()].slice(0, 3) + ', ' + MN[dl.getMonth()].slice(0, 3) + ' ' + dl.getDate() + ' at ' + p2(dl.getHours()) + ':' + p2(dl.getMinutes());
    Q.remDays = Math.ceil(Q.win / 24) + 1;
    const rm = new Date(2026, 9, 1 - Q.remDays, 9, 0);
    Q.remDay = DN[rm.getDay()] + ', ' + MN[rm.getMonth()] + ' ' + rm.getDate();
    const nsN = Q.nsLim + (Q.nsLim === 1 ? ' missed appointment' : ' missed appointments');
    Q.lineFree = 'Free changes up to ' + Q.winT + ' before.';
    Q.lineInsideCancel = Q.lateCancel === 'allow' ? 'After that you can still cancel here, and Maria is told right away.' + (Q.nsOn && Q.nsLate ? ' It counts as a missed appointment.' : '') : 'After that, please message Maria.';
    Q.lineInsideRes = !Q.selfRes ? '' : (Q.lateRes === 'request' ? 'To reschedule after that, send Maria a request.' : 'To reschedule after that, please message Maria.');
    Q.lineRes = Q.selfRes ? (Q.resMax ? 'You can reschedule up to ' + Q.resMax + (Q.resMax === 1 ? ' time.' : ' times.') : 'You can reschedule as often as you need.') : 'To reschedule, please message Maria.';
    Q.lineNs = !Q.nsOn ? '' : ({ tell: 'Maria keeps track of appointments that are missed without a message.', approve: 'After ' + nsN + ' without a message, Maria confirms your new bookings herself.', block: 'After ' + nsN + ' without a message, online booking pauses and Maria contacts you.' })[Q.nsAct];
    const R9 = HSX.Cl_9_Reschedule || {};
    Q.moved = R9.done === 'moved'; Q.asked = R9.done === 'sent';
    Q.when = Q.moved ? R9.fullDay : 'Thursday · October 1'; Q.time = Q.moved ? R9.time : '15:00';
    { const hh = parseInt(Q.time.slice(0, 2), 10) * 60 + parseInt(Q.time.slice(3), 10) + 90; Q.end = p2(Math.floor(hh / 60)) + ':' + p2(hh % 60); }
    const sel = st.sel || { glow: true };
    const seen = st.seen || 'no';
    const opts = [['glow', 'Glow and hydration'], ['calm', 'Calm sensitive skin'], ['texture', 'Smoother texture'], ['unsure', 'Not sure yet']];
    const goals = opts.map((o) => {
      const on = !!sel[o[0]];
      return {
        label: o[1], on: on,
        bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : '#242321', bd: on ? '#242321' : '#E3DED5',
        toggle: () => this.setState({ sel: { ...sel, [o[0]]: !sel[o[0]] } })
      };
    });
    const before = [['yes', 'Yes'], ['no', 'No, first time']].map((o) => ({
      label: o[1], on: seen === o[0],
      bg: seen === o[0] ? '#FFFCF8' : 'transparent',
      sh: seen === o[0] ? '0 1px 3px rgba(36,35,33,0.14)' : 'none',
      pick: () => this.setState({ seen: o[0] })
    }));
    return { goals, before, agree: 'By confirming, you accept Maria\'s rules. ' + Q.lineFree };
  }
}
</script>
</body>
</html>
