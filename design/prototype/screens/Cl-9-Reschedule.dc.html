}

ight:1.45;color:#6B4F10;margin-top:6px">{{msgWhy}}</div></div></sc-if></div><sc-if value="{{isPick}}" hint-placeholder-val="{{true}}"><div><div style="padding:12px 20px 34px;background:linear-gradient(to top,#F8F6F2 70%,rgba(248,246,242,0));" class="m-bar"><button onClick="{{confirm}}" style="width:100%;height:56px;border-radius:18px;background:#242321;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);color:#FFFCF8;font-size:17px;font-weight:600;text-align:center">{{cta}}</button></div></div></sc-if><sc-if value="{{isMsg}}" hint-placeholder-val="{{false}}"><div><div style="padding:12px 20px 34px;background:linear-gradient(to top,#F8F6F2 70%,rgba(248,246,242,0));" class="m-bar"><button onClick="{{openWa}}" style="width:100%;height:56px;border-radius:18px;background:#242321;color:#FFFCF8;font-size:17px;font-weight:600;text-align:center">{{waLabel}}</button></div></div></sc-if></div></sc-if><sc-if value="{{isDone}}" hint-placeholder-val="{{false}}"><div style="flex:1;padding:24px 24px 34px;display:flex;flex-direction:column"><div style="margin-top:30px;width:64px;height:64px;border-radius:50%;background:{{dBg}};color:{{dFg}};display:flex;align-items:center;justify-content:center" class="m-pop"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="m-check"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div><div style="font-family:'Fraunces',Georgia,serif;font-size:34px;line-height:1.08;letter-spacing:-0.015em;font-weight:500;color:#242321;margin-top:22px">{{dTitle}}</div><div style="font-size:15px;line-height:1.4;color:#65625D;margin-top:8px">{{dText}}</div><div style="margin-top:20px;background:#FFFCF8;border:1px solid #ECE7DF;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);border-radius:24px;padding:16px"><div style="font-size:13px;font-weight:600;color:#65625D">{{dLabel}}</div><div class="tn" style="font-size:17px;font-weight:700;margin-top:2px">{{newLabel}}</div></div><div style="flex:1"></div><a href="Bk-9-Appointment.dc.html" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">Back to my appointment</a></div></sc-if></div>

<script type="text/x-dc" data-dc-script data-props='{"timing":{"editor":"enum","options":["early","late"],"default":"early"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sw = (on) => ({ on: on, bg: on ? '#6E8266' : '#D5D0C7', left: on ? '22px' : '2px' });
    const cs = (on) => ({ on: on, bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : '#242321', bd: on ? '#242321' : '#E3DED5' });
const HSX = this.hubState || {}; const CP = HSX.CancelPolicy || {}; const NP = HSX.NoShowPolicy || {};
    const Q = { win: CP.win === undefined ? 24 : CP.win, selfRes: CP.selfRes === undefined ? true : CP.selfRes, resMax: CP.resMax === undefined ? 2 : CP.resMax,
      lateCancel: CP.lateCancel || 'allow', lateRes: CP.lateRes || 'request', remind: CP.remind === undefined ? true : CP.remind,
      nsOn: NP.on === undefined ? true : NP.on, nsLim: NP.lim === undefined ? 3 : NP.lim, nsAct: NP.act || 'approve', nsLate: !!NP.late,
      late: !!(this.props && this.props.timing === 'late'), grace: CP.grace === undefined ? 15 : CP.grace };
    Q.winT = Q.win + ' hours';
    const p2 = (n) => (n < 10 ? '0' : '') + n;
    const DN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], MN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const dl = new Date(new Date(2026, 9, 1, 15, 0).getTime() - Q.win * 3600000);
    Q.deadline = DN[dl.getDay()].slice(0, 3) + ', ' + MN[dl.getMonth()].slice(0, 3) + ' ' + dl.getDate() + ' at ' + p2(dl.getHours()) + ':' + p2(dl.getMinutes());
    Q.remDays = Math.ceil(Q.win / 24) + 1;
    const rm = new Date(2026, 9, 1 - Q.remDays, 9, 0);
    Q.remDay = DN[rm.getDay()] + ', ' + MN[rm.getMonth()] + ' ' + rm.getDate();
    const nsN = Q.nsLim + (Q.nsLim === 1 ? ' missed appointment' : ' missed appointments');
    Q.lineFree = 'Free changes up to ' + Q.winT + ' before.';
    Q.lineInsideCancel = Q.lateCancel === 'allow' ? 'After that you can still cancel here, and Maria is told right away.' + (Q.nsOn && Q.nsLate ? ' It counts as a missed appointment.' : '') : 'After that, please message Maria.';
    Q.lineInsideRes = !Q.selfRes ? '' : (Q.lateRes === 'request' ? 'To reschedule after that, send Maria a request.' : 'To reschedule after that, please message Maria.');
    Q.lineRes = Q.selfRes ? (Q.resMax ? 'You can reschedule up to ' + Q.resMax + (Q.resMax === 1 ? ' time.' : ' times.') : 'You can reschedule as often as you need.') : 'To reschedule, please message Maria.';
    Q.lineNs = !Q.nsOn ? '' : ({ tell: 'Maria keeps track of appointments that are missed without a message.', approve: 'After ' + nsN + ' without a message, Maria confirms your new bookings herself.', block: 'After ' + nsN + ' without a message, online booking pauses and Maria contacts you.' })[Q.nsAct];
    Q.lineGrace = 'Maria holds your time for ' + Q.grace + ' minutes if you are late. Tell her on this page.';
    const R9 = HSX.Cl_9_Reschedule || {};
    const AO = [['brow', 'Eyebrow tint', 15, 20], ['led', 'LED light', 15, 25], ['mask', 'Hand and arm massage', 10, 15], ['ext', 'Extractions', 20, 30]];
    const B2 = HSX.Bk_2_Service || {}; const B5 = HSX.Bk_5_Info || {}; const aoOn = B2.ao || {};
    Q.addList = AO.filter((a) => aoOn[a[0]]); Q.addMin = Q.addList.reduce((s, a) => s + a[2], 0); Q.addPrice = Q.addList.reduce((s, a) => s + a[3], 0);
    Q.addNames = Q.addList.map((a) => a[1]).join(' and ');
    Q.guests = B5.guests || 0; Q.guestName = B5.gname || 'your guest';
    Q.svcTitle = 'Brazilian Glow' + (Q.addNames ? ' + ' + Q.addNames : '');
    Q.perPerson = 90 + Q.addMin; Q.totalMin = Q.perPerson * (1 + Q.guests); Q.totalPrice = (120 + Q.addPrice) * (1 + Q.guests);
    Q.svcMeta = Q.totalMin + ' min · R$' + Q.totalPrice;
    Q.moved = R9.done === 'moved'; Q.asked = R9.done === 'sent';
    Q.when = Q.moved ? R9.fullDay : 'Thursday · October 1'; Q.time = Q.moved ? R9.time : '15:00';
    { const hh = parseInt(Q.time.slice(0, 2), 10) * 60 + parseInt(Q.time.slice(3), 10) + Q.totalMin; Q.end = p2(Math.floor(hh / 60)) + ':' + p2(hh % 60); }

    const defs = [[2, 'Fri', 'Friday'], [3, 'Sat', 'Saturday'], [6, 'Tue', 'Tuesday'], [7, 'Wed', 'Wednesday'], [8, 'Thu', 'Thursday']];
    const taken = { 2: ['15:00'], 3: ['09:00', '10:30'], 6: [], 7: ['18:00'], 8: ['16:30'] };
    const day = st.day || 2, time = st.time || '10:30';
    const ok = (d, t) => (taken[d] || []).indexOf(t) < 0;
    const days = defs.map((d) => ({ dow: d[1], num: d[0], on: day === d[0], bg: day === d[0] ? '#242321' : '#FFFCF8', fg: day === d[0] ? '#FFFCF8' : '#242321', bd: day === d[0] ? '#242321' : '#E3DED5',

    const times = ['09:00', '10:30', '15:00', '16:30', '18:00'].map((t) => { const off = !ok(day, t), on = !off && time === t;
      return { label: t, on, off, bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : (off ? '#8F8B84' : '#242321'), bd: on ? '#242321' : '#E3DED5', deco: off ? 'line-through' : 'none', pick: off ? () => {} : () => this.setState({ time: t }) }; });
    const cur = defs.filter((d) => d[0] === day)[0];
    const dayLabel = cur[1] + ', Oct ' + day, fullDay = cur[2] + ' · October ' + day;
    const done = st.done;
    const used = Q.resMax ? 'This is change 1 of ' + Q.resMax + '. ' : '';
    const msgWhy = !Q.selfRes ? 'Maria moves visits herself. Send her a message and she will find a new time with you.' : 'Free changes ended ' + Q.deadline + '. Send Maria a message and she will find a new time with you.';
    return {
      isForm: !done, isDone: !!done, isPick: mode !== 'msg' && !done, isReq: mode === 'req', isMsg: mode === 'msg' && !done,
      title: mode === 'req' ? 'Ask for a new time' : mode === 'self' ? 'Pick a new time' : 'Please message Maria',
      subtitle: mode === 'req' ? 'You are inside the free period, so Maria decides. She usually answers within a few hours.' : mode === 'self' ? 'Free until ' + Q.deadline + '. Your details stay the same.' : 'Free changes ended. Maria arranges this one with you.',
      curLabel: Q.when + ' · ' + Q.time, days, times, holdText: mode === 'req' ? 'Your current time stays booked until Maria says yes. ' + used.replace('This is', 'If she agrees, this is') : used + 'Your current time is released when you confirm the new one.',
      cta: (mode === 'req' ? 'Ask for ' : 'Move to ') + dayLabel + ' at ' + time,
      confirm: () => this.setState({ done: mode === 'req' ? 'sent' : 'moved', fullDay, time, dayLabel }),
      msgWhy, waLabel: st.wa ? 'Opening WhatsApp' : 'Message Maria on WhatsApp', openWa: () => this.setState({ wa: true }),
      dBg: done === 'sent' ? '#F6ECD6' : '#E6ECE0', dFg: done === 'sent' ? '#7A5C16' : '#45573F',
      dTitle: done === 'sent' ? 'Request sent.' : 'Your appointment moved.',
      dText: done === 'sent' ? 'Maria will answer on WhatsApp. Your current time (' + Q.when + ' at 15:00) stays booked until she does.' : 'A new confirmation is on its way to your WhatsApp, and Maria has been told. Your link stays the same.',
      dLabel: done === 'sent' ? 'You asked for' : 'New time', newLabel: fullDay + ' · ' + time
    };
  }
}
