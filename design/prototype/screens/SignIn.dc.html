<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#242321;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,textarea{border:0;outline:none;padding:0;width:100%;background:none}
a{color:inherit;text-decoration:none}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.ph{background:repeating-linear-gradient(135deg,#E9E3D9 0 8px,#EFEAE1 8px 16px)}
.tn{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
a:focus-visible,button:focus-visible{outline:3px solid #9A5A6C;outline-offset:2px}
/*motion v1*/
@media (prefers-reduced-motion:no-preference){
:root{--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.3,1.25,.5,1)}
@keyframes mRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes mPop{0%{transform:scale(.45);opacity:0}58%{transform:scale(1.09);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mSheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes mDrift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(6%,5%,0) scale(1.12)}}
@keyframes mDot{0%{box-shadow:0 0 0 0 rgba(201,143,159,.6)}70%{box-shadow:0 0 0 8px rgba(201,143,159,0)}100%{box-shadow:0 0 0 0 rgba(201,143,159,0)}}
button,a{-webkit-tap-highlight-color:transparent;transition:transform .24s var(--ease),background-color .24s ease,color .24s ease,border-color .24s ease,box-shadow .3s ease,opacity .24s ease,filter .24s ease}
button:active,a:active{transform:scale(.97)}
button[style*="width:100%"]:active,a[style*="width:100%"]:active,a[style*="display:flex"]:active{transform:scale(.985)}
.m-scrim:active{transform:none}
@media (hover:hover){
button:hover,a:hover{filter:brightness(.975)}
button[style*="background:#242321"]:hover,a[style*="background:#242321"]:hover{filter:brightness(1.22)}
}
button[role="switch"]{transition:background-color .3s var(--ease),transform .2s var(--ease)}
button[role="switch"]>span{transition:left .34s var(--soft),box-shadow .3s ease}
button[role="switch"][aria-checked="true"]>span{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.0)}
.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}
.m-scrim{animation:mFade .28s ease backwards;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#F8F6F2;overflow:hidden;display:flex;flex-direction:column"><div style="position:absolute;left:-60px;top:-80px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(201,143,159,.35),rgba(201,143,159,0) 65%)"></div><div style="position:absolute;right:-90px;top:40px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(169,181,161,.30),rgba(169,181,161,0) 65%)"></div><div style="position:relative;padding:62px 24px 0"><div style="display:flex;align-items:center;gap:12px;height:44px"><svg width="36" height="36" viewBox="0 0 28 28" fill="none" aria-label="Bello Hub mark"><rect width="28" height="28" rx="9" fill="#242321"/><path d="M10 6.5v15" stroke="#FFFCF8" stroke-width="2.2" stroke-linecap="round"/><circle cx="15.2" cy="16" r="4.6" stroke="#FFFCF8" stroke-width="2.2"/><circle cx="10" cy="6.5" r="1.6" fill="#C98F9F"/></svg><div style="font-size:20px;font-weight:700;letter-spacing:-0.03em">bello <span style="color:#C98F9F;font-weight:500">hub</span></div></div></div><sc-if value="{{isPhone}}" hint-placeholder-val="{{true}}"><div style="position:relative;flex:1;min-height:0;display:flex;flex-direction:column"><div style="flex:1;padding:0 24px"><div style="font-family:'Fraunces',Georgia,serif;font-size:40px;line-height:1.04;letter-spacing:-0.015em;font-weight:500;color:#242321;margin-top:40px">Welcome back.</div><div style="font-size:15px;line-height:1.4;color:#65625D;margin-top:10px">Sign in to see your day and your clients.</div><div style="margin-top:30px;display:flex;gap:10px"><div style="height:56px;padding:0 16px;border-radius:16px;background:#FFFCF8;border:1.5px solid #E3DED5;display:flex;align-items:center;gap:6px;font-size:17px;font-weight:600;flex:none">+55<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8C8984" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(90deg)" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></div><input aria-label="Phone number" value="{{ph.value}}" onInput="{{ph.type}}" placeholder="11 98765-4321" style="height:56px;border-radius:16px;background:#FFFCF8;border:1.5px solid #E3DED5;padding:0 16px;font-size:17px"></div><div style="font-size:15px;color:#65625D;margin:10px 2px 0;line-height:1.4">We will text you a 6-digit code. Standard rates may apply.</div><button onClick="{{toEmail}}" style="margin-top:6px;min-height:44px;font-size:15px;font-weight:600;color:#9A5A6C">{{altLabel}}</button></div><div style="padding:12px 20px 34px;background:linear-gradient(to top,#F8F6F2 70%,rgba(248,246,242,0));" class="m-bar"><button onClick="{{next}}" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">Send code</button><a href="Onb-1-Welcome.dc.html" style="margin-top:6px;min-height:48px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#65625D">New to Bello Hub? <b style="font-weight:600;color:#9A5A6C;margin-left:4px">Create your workspace</b></a></div></div></sc-if><sc-if value="{{isCode}}" hint-placeholder-val="{{false}}"><div style="position:relative;flex:1;min-height:0;display:flex;flex-direction:column"><div style="flex:1;padding:0 24px"><div style="font-family:'Fraunces',Georgia,serif;font-size:40px;line-height:1.04;letter-spacing:-0.015em;font-weight:500;color:#242321;margin-top:40px">Check your phone.</div><div style="font-size:15px;line-height:1.4;color:#65625D;margin-top:10px">Enter the 6-digit code we sent to +55 {{ph.value}}.</div><input aria-label="6-digit code" value="{{cd.value}}" onInput="{{cd.type}}" placeholder="000000" style="margin-top:30px;height:68px;border-radius:18px;background:#FFFCF8;border:1.5px solid #E3DED5;text-align:center;font-size:30px;letter-spacing:12px;font-weight:600" class="tn"><button onClick="{{resend}}" style="margin-top:12px;min-height:44px;font-size:15px;font-weight:600;color:#9A5A6C">{{resendLabel}}</button></div><div style="padding:12px 20px 34px;background:linear-gradient(to top,#F8F6F2 70%,rgba(248,246,242,0));" class="m-bar"><a href="Home.dc.html" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">Sign in</a><button onClick="{{back}}" style="width:100%;margin-top:6px;min-height:48px;text-align:center;font-size:15px;font-weight:600;color:#65625D">Use a different number</button></div></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sw = (on) => ({ on: on, bg: on ? '#6E8266' : '#D5D0C7', left: on ? '22px' : '2px' });
    const cs = (on) => ({ on: on, bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : '#242321', bd: on ? '#242321' : '#E3DED5' });

    const step = st.step || 'phone'; const ph = st.ph === undefined ? '11 98765-4321' : st.ph; const cd = st.cd || ''; const em = !!st.em;
    return {
      isPhone: step === 'phone', isCode: step === 'code',
      ph: { value: ph, type: (e) => this.setState({ ph: e.target.value }) }, cd: { value: cd, type: (e) => this.setState({ cd: e.target.value }) },
      altLabel: em ? 'Use phone number instead' : 'Use email instead', toEmail: () => this.setState({ em: !em }),
      next: () => this.setState({ step: 'code' }), back: () => this.setState({ step: 'phone', cd: '' }),
      resendLabel: st.resent ? 'New code sent' : 'Send the code again', resend: () => this.setState({ resent: true })
    };
  }
}
</script>
