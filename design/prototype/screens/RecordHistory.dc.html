<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#242321;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,textarea{border:0;outline:none;padding:0;width:100%;background:none}
a{color:inherit;text-decoration:none}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.ph{background:repeating-linear-gradient(135deg,#E9E3D9 0 8px,#EFEAE1 8px 16px)}
.tn{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
a:focus-visible,button:focus-visible{outline:3px solid #9A5A6C;outline-offset:2px}
/*motion v1*/
@media (prefers-reduced-motion:no-preference){
:root{--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.3,1.25,.5,1)}
@keyframes mRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes mPop{0%{transform:scale(.45);opacity:0}58%{transform:scale(1.09);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mSheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes mDrift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(6%,5%,0) scale(1.12)}}
@keyframes mDot{0%{box-shadow:0 0 0 0 rgba(201,143,159,.6)}70%{box-shadow:0 0 0 8px rgba(201,143,159,0)}100%{box-shadow:0 0 0 0 rgba(201,143,159,0)}}
button,a{-webkit-tap-highlight-color:transparent;transition:transform .24s var(--ease),background-color .24s ease,color .24s ease,border-color .24s ease,box-shadow .3s ease,opacity .24s ease,filter .24s ease}
button:active,a:active{transform:scale(.97)}
button[style*="width:100%"]:active,a[style*="width:100%"]:active,a[style*="display:flex"]:active{transform:scale(.985)}
.m-scrim:active{transform:none}
@media (hover:hover){
button:hover,a:hover{filter:brightness(.975)}
button[style*="background:#242321"]:hover,a[style*="background:#242321"]:hover{filter:brightness(1.22)}
}
button[role="switch"]{transition:background-color .3s var(--ease),transform .2s var(--ease)}
button[role="switch"]>span{transition:left .34s var(--soft),box-shadow .3s ease}
button[role="switch"][aria-checked="true"]>span{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.0)}
.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}
.m-scrim{animation:mFade .28s ease backwards;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#F8F6F2;overflow:hidden;display:flex;flex-direction:column"><div style="padding:62px 20px 0"><div style="display:flex;align-items:center;justify-content:space-between;height:44px"><a href="ClientProfile.dc.html" style="display:flex;align-items:center;height:44px;margin-left:-8px;padding-right:12px;font-size:17px;color:#9A5A6C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg>Ana</a></div><div style="font-family:'Fraunces',Georgia,serif;font-size:34px;line-height:1.05;letter-spacing:-0.015em;font-weight:500;color:#242321;margin-top:6px">Record history</div><div style="font-size:15px;line-height:1.4;color:#65625D;margin-top:6px">Glow Facial · Aug 30</div></div><div class="noscroll" style="flex:1;overflow-y:auto;padding:8px 20px 24px"><div style="border-radius:22px;background:#EEF2EA;padding:14px 16px;display:flex;gap:12px;align-items:flex-start"><span style="width:36px;height:36px;border-radius:12px;background:#EEF2EA;color:#56684F;display:inline-flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></span><div style="font-size:15px;line-height:1.45;color:#2F3A2B;padding-top:1px"><b style="font-weight:600">Locked.</b> Original entries can't be edited. Changes are added below as corrections and logged with date and time.</div></div><div style="position:relative;margin-top:20px;padding-left:36px"><div style="position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:#E3DED5"></div><sc-for list="{{log}}" as="e" hint-placeholder-count="5"><div style="position:relative;padding-bottom:22px"><span style="position:absolute;left:-36px;top:2px;width:24px;height:24px;border-radius:50%;background:{{e.bg}};border:3px solid #F8F6F2;box-shadow:0 0 0 1.5px {{e.ring}}"></span><div style="font-size:13px;color:#65625D" class="tn">{{e.when}}</div><div style="font-size:16px;font-weight:600;margin-top:2px">{{e.title}}</div><div style="font-size:15px;line-height:1.4;color:#4A4743;margin-top:2px">{{e.text}}</div></div></sc-for></div></div><div style="padding:12px 20px 34px;background:linear-gradient(to top,#F8F6F2 70%,rgba(248,246,242,0));" class="m-bar"><button onClick="{{openAdd}}" style="height:56px;border-radius:18px;background:#FFFCF8;border:1px solid #D9D4CB;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;width:100%;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add correction</button></div><sc-if value="{{addOpen}}" hint-placeholder-val="{{false}}"><div style="position:absolute;inset:0;background:rgba(36,35,33,.38);display:flex;flex-direction:column;justify-content:flex-end;z-index:20" class="m-scrim"><div style="background:#FFFCF8;border-radius:30px 30px 0 0;padding:10px 20px 34px;box-shadow:0 -12px 40px -12px rgba(70,45,30,.25)" class="m-sheet"><div style="width:36px;height:5px;border-radius:3px;background:#D9D4CB;margin:0 auto 14px"></div><div style="font-size:20px;font-weight:600">Add correction</div><div style="font-size:15px;color:#65625D;margin-top:2px">It will be saved as a new entry. The original stays unchanged.</div><div style="margin-top:14px"><div style="font-size:15px;font-weight:600;color:#65625D;margin:0 2px 6px">What should be corrected?</div><input aria-label="What should be corrected?" placeholder="e.g. Aftercare: avoid sun for 48 hours" value="{{cf.value}}" onInput="{{cf.type}}" style="height:52px;border-radius:14px;background:#F4F1EB;border:1.5px solid #E3DED5;padding:0 14px;font-size:16px"></div><div style="margin-top:16px"><button onClick="{{saveAdd}}" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">Save correction</button></div><button onClick="{{closeAdd}}" style="width:100%;height:48px;margin-top:6px;text-align:center;font-size:16px;font-weight:600;color:#65625D">Cancel</button></div></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sw = (on) => ({ on: on, bg: on ? '#6E8266' : '#D5D0C7', left: on ? '22px' : '2px' });
    const cs = (on) => ({ on: on, bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : '#242321', bd: on ? '#242321' : '#E3DED5' });

    const base = [
      { when: 'Sep 2 · 10:12', title: 'Correction by Maria', text: 'Added aftercare note: gentle cleansing for 48 hours.', bg: '#F7ECEE', ring: '#C98F9F' },
      { when: 'Aug 31 · 17:42', title: 'Record locked', text: 'Locked automatically 24 hours after it was created.', bg: '#EEF2EA', ring: '#6E8266' },
      { when: 'Aug 30 · 18:05', title: 'Edited by Maria', text: 'Result: Neutral changed to Good response.', bg: '#F6ECD6', ring: '#A8803A' },
      { when: 'Aug 30 · 17:42', title: 'Created by Maria', text: 'From a voice note. Products: Calming serum. Result: Neutral.', bg: '#FFFCF8', ring: '#8C8984' }
    ];
    const added = st.added || [];
    const cf = st.cf || '';
    return {
      log: added.concat(base), addOpen: !!st.addOpen, openAdd: () => this.setState({ addOpen: true }), closeAdd: () => this.setState({ addOpen: false }),
      cf: { value: cf, type: (e) => this.setState({ cf: e.target.value }) },
      saveAdd: () => this.setState({ added: cf.trim() ? [{ when: 'Sep 30 · now', title: 'Correction by Maria', text: cf.trim(), bg: '#F7ECEE', ring: '#C98F9F' }].concat(added) : added, addOpen: false, cf: '' })
    };
  }
}
</script>
</body>
</html>
