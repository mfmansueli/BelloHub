<style>

}

.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}

.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>

<div style="position:relative;width:390px;height:844px;background:#F8F6F2;overflow:hidden;display:flex;flex-direction:column"><div style="padding:62px 20px 0"><div style="height:44px;display:flex;align-items:center;gap:10px"><a href="Bk-9-Appointment.dc.html" aria-label="Back" style="width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg></a><span style="width:28px;height:28px;border-radius:50%;background:#242321;color:#FFFCF8;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">MB</span><span style="font-size:15px;font-weight:600">Maria Beauty</span></div></div><sc-if value="{{isForm}}" hint-placeholder-val="{{true}}"><div style="flex:1;min-height:0;display:flex;flex-direction:column"><div class="noscroll" style="flex:1;overflow-y:auto;padding:8px 20px 24px"><div style="font-family:'Fraunces',Georgia,serif;font-size:34px;line-height:1.05;letter-spacing:-0.015em;font-weight:500;color:#242321;margin-top:14px">{{title}}</div><div style="font-size:15px;line-height:1.4;color:#65625D;margin-top:8px">{{subtitle}}</div><sc-if value="{{showWarn}}" hint-placeholder-val="{{false}}"><div style="margin-top:16px;display:flex;gap:12px;padding:14px 16px;border-radius:22px;background:{{warnBg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A5C16" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span style="flex:1;font-size:15px;line-height:1.45;color:{{warnFg}}"><span style="display:block;font-weight:600">{{warnTitle}}</span>{{warnText}}</span></div></sc-if><div style="margin-top:20px"><div style="background:#FFFCF8;border:1px solid #ECE7DF;border-radius:24px;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);padding:0;overflow:hidden;"><div style="padding:16px"><div style="font-size:20px;font-weight:700;letter-spacing:-0.01em">Brazilian Glow</div><div style="font-size:15px;color:#65625D;margin-top:2px">90 min</div><div style="height:1px;background:#F0ECE5;margin:12px 0"></div><div style="display:flex;align-items:center;gap:12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#65625D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg><div><div style="font-size:16px;font-weight:600">{{when}}</div><div class="tn" style="font-size:15px;color:#65625D">{{time}} to {{end}} · Maria Beauty</div></div></div></div></div></div><sc-if value="{{showReasons}}" hint-placeholder-val="{{true}}"><div><div style="font-size:15px;font-weight:600;margin:24px 2px 10px">Why are you cancelling?</div><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{reasons}}" as="r" hint-placeholder-count="4"><button onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;background:{{r.bg}};color:{{r.fg}};border:1.5px solid {{r.bd}};">{{r.label}}</button></sc-for></div><div style="font-size:13px;color:#65625D;margin:10px 2px 0">Optional. It helps Maria offer you a better time.</div></div></sc-if></div><sc-if value="{{isAct}}" hint-placeholder-val="{{true}}"><div><div style="padding:12px 20px 34px;background:linear-gradient(to top,#F8F6F2 70%,rgba(248,246,242,0));" class="m-bar"><sc-if value="{{resGo}}" hint-placeholder-val="{{true}}"><div><a href="Cl-9-Reschedule.dc.html" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">{{resLabel}}</a></div></sc-if><sc-if value="{{resMsg}}" hint-placeholder-val="{{false}}"><div><button onClick="{{openWa}}" style="height:56px;border-radius:18px;background:#FFFCF8;border:1px solid #D9D4CB;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;width:100%;">Message Maria to reschedule</button></div></sc-if><button onClick="{{cancel}}" style="width:100%;margin-top:8px;height:52px;border-radius:16px;border:1.5px solid #E6C3BB;color:#9A4535;font-size:16px;font-weight:600;text-align:center">{{cancelLabel}}</button></div></div></sc-if><sc-if value="{{isMsg}}" hint-placeholder-val="{{false}}"><div><div style="padding:12px 20px 34px;background:linear-gradient(to top,#F8F6F2 70%,rgba(248,246,242,0));" class="m-bar"><button onClick="{{openWa}}" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">{{waLabel}}</button></div></div></sc-if></div></sc-if><sc-if value="{{isDone}}" hint-placeholder-val="{{false}}"><div style="flex:1;min-height:0;display:flex;flex-direction:column"><div style="flex:1;padding:62px 24px 34px;display:flex;flex-direction:column"><div style="height:44px"></div><div style="margin-top:30px;width:64px;height:64px;border-radius:50%;background:#EFEBE4;color:#4A4743;display:flex;align-items:center;justify-content:center" class="m-pop"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="m-check"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div><div style="font-family:'Fraunces',Georgia,serif;font-size:34px;line-height:1.06;letter-spacing:-0.015em;font-weight:500;color:#242321;margin-top:20px">{{doneTitle}}</div><div style="font-size:15px;line-height:1.4;color:#65625D;margin-top:8px">{{doneText}}</div><div style="flex:1"></div><a href="Cl-3-Rebook.dc.html" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">Book another time</a></div></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"timing":{"editor":"enum","options":["early","late"],"default":"early"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sw = (on) => ({ on: on, bg: on ? '#6E8266' : '#D5D0C7', left: on ? '22px' : '2px' });
    const cs = (on) => ({ on: on, bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : '#242321', bd: on ? '#242321' : '#E3DED5' });
const HSX = this.hubState || {}; const CP = HSX.CancelPolicy || {}; const NP = HSX.NoShowPolicy || {};
    const Q = { win: CP.win === undefined ? 24 : CP.win, selfRes: CP.selfRes === undefined ? true : CP.selfRes, resMax: CP.resMax === undefined ? 2 : CP.resMax,
      lateCancel: CP.lateCancel || 'allow', lateRes: CP.lateRes || 'request', remind: CP.remind === undefined ? true : CP.remind,
      nsOn: NP.on === undefined ? true : NP.on, nsLim: NP.lim === undefined ? 3 : NP.lim, nsAct: NP.act || 'approve', nsLate: !!NP.late,
      late: !!(this.props && this.props.timing === 'late') };
    Q.winT = Q.win + ' hours';
    const p2 = (n) => (n < 10 ? '0' : '') + n;
    const DN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], MN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const dl = new Date(new Date(2026, 9, 1, 15, 0).getTime() - Q.win * 3600000);
    Q.deadline = DN[dl.getDay()].slice(0, 3) + ', ' + MN[dl.getMonth()].slice(0, 3) + ' ' + dl.getDate() + ' at ' + p2(dl.getHours()) + ':' + p2(dl.getMinutes());
    Q.remDays = Math.ceil(Q.win / 24) + 1;
    const rm = new Date(2026, 9, 1 - Q.remDays, 9, 0);
    Q.remDay = DN[rm.getDay()] + ', ' + MN[rm.getMonth()] + ' ' + rm.getDate();
    const nsN = Q.nsLim + (Q.nsLim === 1 ? ' missed appointment' : ' missed appointments');
    Q.lineFree = 'Free changes up to ' + Q.winT + ' before.';
    Q.lineInsideCancel = Q.lateCancel === 'allow' ? 'After that you can still cancel here, and Maria is told right away.' + (Q.nsOn && Q.nsLate ? ' It counts as a missed appointment.' : '') : 'After that, please message Maria.';
    Q.lineInsideRes = !Q.selfRes ? '' : (Q.lateRes === 'request' ? 'To reschedule after that, send Maria a request.' : 'To reschedule after that, please message Maria.');
    Q.lineRes = Q.selfRes ? (Q.resMax ? 'You can reschedule up to ' + Q.resMax + (Q.resMax === 1 ? ' time.' : ' times.') : 'You can reschedule as often as you need.') : 'To reschedule, please message Maria.';
    Q.lineNs = !Q.nsOn ? '' : ({ tell: 'Maria keeps track of appointments that are missed without a message.', approve: 'After ' + nsN + ' without a message, Maria confirms your new bookings herself.', block: 'After ' + nsN + ' without a message, online booking pauses and Maria contacts you.' })[Q.nsAct];
    const R9 = HSX.Cl_9_Reschedule || {};
    Q.moved = R9.done === 'moved'; Q.asked = R9.done === 'sent';
    Q.when = Q.moved ? R9.fullDay : 'Thursday · October 1'; Q.time = Q.moved ? R9.time : '15:00';
    { const hh = parseInt(Q.time.slice(0, 2), 10) * 60 + parseInt(Q.time.slice(3), 10) + 90; Q.end = p2(Math.floor(hh / 60)) + ':' + p2(hh % 60); }
    const r = st.r || 'Schedule conflict';
    const early = !Q.late, mode = early ? 'early' : (Q.lateCancel === 'allow' ? 'allow' : 'msg');
    const resGo = Q.selfRes && (early || Q.lateRes === 'request');
    const counts = mode === 'allow' && Q.nsOn && Q.nsLate;
    return {
      isForm: !st.done, isDone: !!st.done, when: Q.when, time: Q.time, end: Q.end,
      title: mode === 'early' ? 'Need to change your plans?' : mode === 'allow' ? 'Cancel inside the free period?' : 'Please message Maria.',
      subtitle: mode === 'early' ? Q.lineFree + ' You have until ' + Q.deadline + '.' : mode === 'allow' ? 'You can still cancel. Maria is told right away, so she can offer your time to someone else.' : 'Free changes ended ' + Q.deadline + '. Changes now go through Maria.',
      showWarn: counts, warnBg: '#F6ECD6', warnFg: '#5C4510', warnTitle: 'This counts as a missed appointment.',
      warnText: 'Maria allows up to ' + Q.nsLim + ' before she steps in.' + (resGo ? ' Asking to reschedule instead does not count.' : ''),
      showReasons: mode !== 'msg', isAct: mode !== 'msg', isMsg: mode === 'msg',
      reasons: ['Schedule conflict', 'Feeling unwell', 'Changed my mind', 'Other'].map((x) => ({ label: x, ...cs(r === x), pick: () => this.setState({ r: x }) })),
      resGo: resGo, resMsg: !resGo, resLabel: early ? 'Reschedule instead' : 'Ask to reschedule instead', cancelLabel: early ? 'Cancel appointment' : 'Cancel anyway',
      cancel: () => this.setState({ done: true }),
      doneTitle: mode === 'allow' ? 'Cancelled. Thank you for telling Maria.' : 'Your appointment was cancelled.',
      doneText: mode === 'allow' ? 'She knows now and can offer your time to someone else.' + (counts ? ' This one counts as a late cancellation.' : '') : 'Maria has been notified. You can book another time whenever you like.',
      waLabel: st.wa ? 'Opening WhatsApp' : 'Message Maria on WhatsApp', openWa: () => this.setState({ wa: true })
    };
  }
}
</script>
