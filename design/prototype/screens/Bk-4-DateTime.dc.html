<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Date and time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#242321;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
a{color:inherit;text-decoration:none}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.tn{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
a:focus-visible,button:focus-visible{outline:3px solid #9A5A6C;outline-offset:2px}
/*motion v1*/
@media (prefers-reduced-motion:no-preference){
:root{--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.3,1.25,.5,1)}
@keyframes mRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes mPop{0%{transform:scale(.45);opacity:0}58%{transform:scale(1.09);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mSheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes mDrift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(6%,5%,0) scale(1.12)}}
@keyframes mDot{0%{box-shadow:0 0 0 0 rgba(201,143,159,.6)}70%{box-shadow:0 0 0 8px rgba(201,143,159,0)}100%{box-shadow:0 0 0 0 rgba(201,143,159,0)}}
button,a{-webkit-tap-highlight-color:transparent;transition:transform .24s var(--ease),background-color .24s ease,color .24s ease,border-color .24s ease,box-shadow .3s ease,opacity .24s ease,filter .24s ease}
button:active,a:active{transform:scale(.97)}
button[style*="width:100%"]:active,a[style*="width:100%"]:active,a[style*="display:flex"]:active{transform:scale(.985)}
.m-scrim:active{transform:none}
@media (hover:hover){
button:hover,a:hover{filter:brightness(.975)}
button[style*="background:#242321"]:hover,a[style*="background:#242321"]:hover{filter:brightness(1.22)}
}
button[role="switch"]{transition:background-color .3s var(--ease),transform .2s var(--ease)}
button[role="switch"]>span{transition:left .34s var(--soft),box-shadow .3s ease}
button[role="switch"][aria-checked="true"]>span{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.0)}
.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}
.m-scrim{animation:mFade .28s ease backwards;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#F8F6F2;overflow:hidden">
<div class="noscroll" style="position:absolute;inset:0;overflow-y:auto;padding:62px 20px 130px">

<div style="display:flex;align-items:center;gap:12px;height:44px">
<a href="Bk-2-Service.dc.html" aria-label="Back" style="width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg></a>
<div style="flex:1;display:flex;gap:6px"><div style="flex:1;height:4px;border-radius:2px;background:#242321"></div><div style="flex:1;height:4px;border-radius:2px;background:#242321"></div><div style="flex:1;height:4px;border-radius:2px;background:#DDD8CF"></div><div style="flex:1;height:4px;border-radius:2px;background:#DDD8CF"></div><div style="flex:1;height:4px;border-radius:2px;background:#DDD8CF"></div></div>
<span style="width:20px"></span>
</div>

<div style="margin-top:24px;font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:500;letter-spacing:-0.015em;line-height:1.1">Pick a day and time</div>
<div style="font-size:16px;color:#65625D;margin-top:6px">Brazilian Glow · 90 min · Maria Beauty</div>

<div style="margin-top:20px;background:#FFFCF8;border:1px solid #ECE7DF;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);border-radius:24px;padding:16px 12px 12px">
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px">
<div style="font-size:17px;font-weight:600">{{monthLabel}}</div>
<div style="display:flex;gap:4px">
<button onClick="{{prevM}}" aria-label="Previous month" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#8C8984"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg></button>
<button onClick="{{nextM}}" aria-label="Next month" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 6 6 6-6 6"/></svg></button>
</div>
</div>
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px">
<div style="text-align:center;font-size:12px;color:#65625D;height:28px">S</div><div style="text-align:center;font-size:12px;color:#65625D;height:28px">M</div><div style="text-align:center;font-size:12px;color:#65625D;height:28px">T</div><div style="text-align:center;font-size:12px;color:#65625D;height:28px">W</div><div style="text-align:center;font-size:12px;color:#65625D;height:28px">T</div><div style="text-align:center;font-size:12px;color:#65625D;height:28px">F</div><div style="text-align:center;font-size:12px;color:#65625D;height:28px">S</div>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<button onClick="{{c.pick}}" aria-label="{{c.aria}}" aria-pressed="{{c.on}}" style="height:44px;display:flex;align-items:center;justify-content:center"><span style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;background:{{c.bg}};color:{{c.fg}}">{{c.label}}</span></button>
</sc-for>
</div>
</div>

<div style="margin-top:22px;font-size:17px;font-weight:600">{{dayLabel}}</div>
<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px">
<sc-for list="{{times}}" as="t" hint-placeholder-count="5">
<button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height:48px;min-width:96px;padding:0 20px;border-radius:14px;font-size:17px;font-weight:600;text-align:center;background:{{t.bg}};color:{{t.fg}};border:1.5px solid {{t.bd}}">{{t.label}}</button>
</sc-for>
</div>
<div style="font-size:13px;color:#65625D;margin-top:12px">Times shown in São Paulo time.</div><button onClick="{{joinWait}}" style="margin-top:14px;width:100%;min-height:60px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:22px;background:#F7ECEE;text-align:left"><span style="flex:1"><span style="display:block;font-size:16px;font-weight:600;color:#5E3744">{{waitTitle}}</span><span style="display:block;font-size:15px;color:#8A4C5F">{{waitSub}}</span></span></button>

</div>

<div style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 34px;background:rgba(255,252,248,0.96);border-top:1px solid #ECE7DF">
<a href="Bk-5-Info.dc.html" style="height:56px;border-radius:18px;background:#242321;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);color:#FFFCF8;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600">Continue</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const day = st.day || 1;
    const time = st.time || '15:00';
    const names = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const cells = [];
    for (let i = 0; i < 4; i++) cells.push({ label: '', aria: '', on: false, bg: 'transparent', fg: '#242321', pick: () => {} });
    for (let d = 1; d <= 31; d++) {
      const dow = (3 + d) % 7;
      const open = dow >= 2 && dow <= 6;
      const on = open && day === d;
      cells.push({
        label: d, aria: 'October ' + d + (open ? '' : ', unavailable'), on: on,
        bg: on ? '#242321' : 'transparent',
        fg: on ? '#FFFCF8' : (open ? '#242321' : '#B9B3A9'),
        pick: open ? () => this.setState({ day: d }) : () => {}
      });
    }
    const dow = (3 + day) % 7;
    const times = ['09:00', '10:30', '15:00', '16:30', '18:00'].map((t) => ({
      label: t, on: time === t,
      bg: time === t ? '#242321' : '#FFFCF8', fg: time === t ? '#FFFCF8' : '#242321', bd: time === t ? '#242321' : '#E3DED5',
      pick: () => this.setState({ time: t })
    }));
    return { waitTitle: st.wait ? "You are on the waitlist" : "Not seeing a time that works?", waitSub: st.wait ? "Maria will message you if a time opens up." : "Join the waitlist and Maria will message you.", joinWait: () => this.setState({ wait: true }), monthLabel: (st.m ? "November 2026 · opens Oct 15" : "October 2026"), prevM: () => this.setState({ m: 0 }), nextM: () => this.setState({ m: 1 }), cells, times, dayLabel: names[dow] + ', October ' + day };
  }
}
</script>
</body>
</html>
