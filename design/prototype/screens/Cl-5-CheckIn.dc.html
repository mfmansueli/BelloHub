<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#242321;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,textarea{border:0;outline:none;padding:0;width:100%;background:none}
a{color:inherit;text-decoration:none}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.ph{background:repeating-linear-gradient(135deg,#E9E3D9 0 8px,#EFEAE1 8px 16px)}
.tn{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
a:focus-visible,button:focus-visible{outline:3px solid #9A5A6C;outline-offset:2px}
/*motion v1*/
@media (prefers-reduced-motion:no-preference){
:root{--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.3,1.25,.5,1)}
@keyframes mRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes mPop{0%{transform:scale(.45);opacity:0}58%{transform:scale(1.09);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mSheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes mDrift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(6%,5%,0) scale(1.12)}}
@keyframes mDot{0%{box-shadow:0 0 0 0 rgba(201,143,159,.6)}70%{box-shadow:0 0 0 8px rgba(201,143,159,0)}100%{box-shadow:0 0 0 0 rgba(201,143,159,0)}}
button,a{-webkit-tap-highlight-color:transparent;transition:transform .24s var(--ease),background-color .24s ease,color .24s ease,border-color .24s ease,box-shadow .3s ease,opacity .24s ease,filter .24s ease}
button:active,a:active{transform:scale(.97)}
button[style*="width:100%"]:active,a[style*="width:100%"]:active,a[style*="display:flex"]:active{transform:scale(.985)}
.m-scrim:active{transform:none}
@media (hover:hover){
button:hover,a:hover{filter:brightness(.975)}
button[style*="background:#242321"]:hover,a[style*="background:#242321"]:hover{filter:brightness(1.22)}
}
button[role="switch"]{transition:background-color .3s var(--ease),transform .2s var(--ease)}
button[role="switch"]>span{transition:left .34s var(--soft),box-shadow .3s ease}
button[role="switch"][aria-checked="true"]>span{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.0)}
.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}
.m-scrim{animation:mFade .28s ease backwards;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#F8F6F2;overflow:hidden;display:flex;flex-direction:column"><div style="padding:62px 20px 0"><div style="height:44px;display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:50%;background:#242321;color:#FFFCF8;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">MB</span><span style="font-size:15px;font-weight:600">Maria Beauty</span></div></div><sc-if value="{{isForm}}" hint-placeholder-val="{{true}}"><div style="flex:1;min-height:0;display:flex;flex-direction:column"><div class="noscroll" style="flex:1;overflow-y:auto;padding:8px 20px 24px"><div style="font-family:'Fraunces',Georgia,serif;font-size:34px;line-height:1.06;letter-spacing:-0.015em;font-weight:500;color:#242321;margin-top:14px">How is your skin today?</div><div style="font-size:15px;line-height:1.4;color:#65625D;margin-top:8px">Hi Ana, a quick check-in after your Brazilian Glow. One tap is enough.</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:22px"><sc-for list="{{opts}}" as="o" hint-placeholder-count="4"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="display:flex;align-items:center;gap:14px;min-height:64px;padding:0 18px;border-radius:20px;background:{{o.bg}};border:1.5px solid {{o.bd}};box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14)"><span style="width:14px;height:14px;border-radius:50%;background:{{o.dot}};flex:none"></span><span style="flex:1;font-size:17px;font-weight:600">{{o.label}}</span><span style="width:24px;height:24px;border-radius:50%;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;opacity:{{o.ck}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></button></sc-for></div><sc-if value="{{worried}}" hint-placeholder-val="{{false}}"><div style="margin-top:14px;border-radius:18px;background:#F7ECEE;padding:14px 16px;font-size:15px;line-height:1.45;color:#5E3744">Maria will get in touch with you today. If it feels severe or keeps getting worse, please contact a doctor.</div></sc-if><div style="margin-top:20px"><div style="font-size:15px;font-weight:600;color:#65625D;margin:0 2px 6px">Anything to add?</div><input aria-label="Anything to add?" placeholder="Optional" value="{{nt.value}}" onInput="{{nt.type}}" style="height:52px;border-radius:14px;background:#F4F1EB;border:1.5px solid #E3DED5;padding:0 14px;font-size:16px"></div><button onClick="{{addPhoto}}" style="margin-top:12px;width:100%;height:68px;border-radius:18px;border:1.5px dashed #C9C4BB;display:flex;align-items:center;justify-content:center;gap:8px;color:#65625D;font-size:15px;font-weight:600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5a2 2 0 0 1 2-2h1.6l1.4-2h6l1.4 2H18a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.4"/></svg>{{photoLabel}}</button></div><div style="padding:12px 20px 34px;background:linear-gradient(to top,#F8F6F2 70%,rgba(248,246,242,0));" class="m-bar"><button onClick="{{send}}" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">Send to Maria</button></div></div></sc-if><sc-if value="{{isDone}}" hint-placeholder-val="{{false}}"><div style="flex:1;min-height:0;display:flex;flex-direction:column"><div style="flex:1;padding:62px 24px 34px;display:flex;flex-direction:column"><div style="height:44px"></div><div style="margin-top:30px;width:64px;height:64px;border-radius:50%;background:#C98F9F;color:#242321;display:flex;align-items:center;justify-content:center" class="m-pop"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="m-check"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div><div style="font-family:'Fraunces',Georgia,serif;font-size:40px;line-height:1.04;letter-spacing:-0.015em;font-weight:500;color:#242321;margin-top:20px">Thank you, Ana.</div><div style="font-size:15px;line-height:1.4;color:#65625D;margin-top:8px">{{reply}}</div><div style="flex:1"></div><a href="Cl-2-Portal.dc.html" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">Back to my appointments</a></div></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sw = (on) => ({ on: on, bg: on ? '#6E8266' : '#D5D0C7', left: on ? '22px' : '2px' });
    const cs = (on) => ({ on: on, bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : '#242321', bd: on ? '#242321' : '#E3DED5' });

    const sel = st.sel || 'All normal';
    const defs = [['Great', '#6E8266'], ['All normal', '#A9B5A1'], ['A bit irritated', '#E8B49E'], ['Irritated', '#C98F9F']];
    return {
      isForm: !st.done, isDone: !!st.done,
      opts: defs.map((d) => ({ label: d[0], dot: d[1], on: sel === d[0], bg: sel === d[0] ? '#FFFCF8' : '#FFFCF8', bd: sel === d[0] ? '#242321' : '#ECE7DF', ck: sel === d[0] ? 1 : 0, pick: () => this.setState({ sel: d[0] }) })),
      worried: sel === 'A bit irritated' || sel === 'Irritated', nt: { value: st.nt || '', type: (e) => this.setState({ nt: e.target.value }) },
      photoLabel: st.photo ? 'Photo added' : 'Add a photo', addPhoto: () => this.setState({ photo: true }), send: () => this.setState({ done: true }),
      reply: (sel === 'A bit irritated' || sel === 'Irritated') ? 'Maria has your message and will get in touch with you today.' : 'Maria has your answer. See you at your next visit.'
    };
  }
}
</script>
</body>
</html>
