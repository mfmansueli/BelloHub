<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Client forms</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#242321;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,textarea{border:0;outline:none;padding:0;width:100%;background:none}
a{color:inherit;text-decoration:none}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.ph{background:repeating-linear-gradient(135deg,#E9E3D9 0 8px,#EFEAE1 8px 16px)}
.tn{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
a:focus-visible,button:focus-visible{outline:3px solid #9A5A6C;outline-offset:2px}
/*motion v1*/
@media (prefers-reduced-motion:no-preference){
:root{--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.3,1.25,.5,1)}
@keyframes mRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes mPop{0%{transform:scale(.45);opacity:0}58%{transform:scale(1.09);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mSheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes mDrift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(6%,5%,0) scale(1.12)}}
@keyframes mDot{0%{box-shadow:0 0 0 0 rgba(201,143,159,.6)}70%{box-shadow:0 0 0 8px rgba(201,143,159,0)}100%{box-shadow:0 0 0 0 rgba(201,143,159,0)}}
button,a{-webkit-tap-highlight-color:transparent;transition:transform .24s var(--ease),background-color .24s ease,color .24s ease,border-color .24s ease,box-shadow .3s ease,opacity .24s ease,filter .24s ease}
button:active,a:active{transform:scale(.97)}
button[style*="width:100%"]:active,a[style*="width:100%"]:active,a[style*="display:flex"]:active{transform:scale(.985)}
.m-scrim:active{transform:none}
@media (hover:hover){
button:hover,a:hover{filter:brightness(.975)}
button[style*="background:#242321"]:hover,a[style*="background:#242321"]:hover{filter:brightness(1.22)}
}
button[role="switch"]{transition:background-color .3s var(--ease),transform .2s var(--ease)}
button[role="switch"]>span{transition:left .34s var(--soft),box-shadow .3s ease}
button[role="switch"][aria-checked="true"]>span{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.0)}
.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}
.m-scrim{animation:mFade .28s ease backwards;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#F8F6F2;overflow:hidden;display:flex;flex-direction:column"><div style="padding:62px 20px 0"><div style="display:flex;align-items:center;justify-content:space-between;height:44px"><a href="RecordTemplate.dc.html" style="display:flex;align-items:center;height:44px;margin-left:-8px;padding-right:12px;font-size:17px;color:#9A5A6C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg>Record fields</a></div><div style="font-family:'Fraunces',Georgia,serif;font-size:34px;line-height:1.05;letter-spacing:-0.015em;font-weight:500;color:#242321;margin-top:6px">Client forms</div><div style="font-size:15px;line-height:1.4;color:#65625D;margin-top:6px">What clients fill in on their phone before a first visit.</div></div><div class="noscroll" style="flex:1;overflow-y:auto;padding:8px 20px 24px"><div style="display:flex;align-items:center;justify-content:space-between;margin:22px 2px 4px;min-height:32px"><div style="font-size:20px;font-weight:600;letter-spacing:-0.01em">Health form questions</div></div><div style="background:#FFFCF8;border:1px solid #ECE7DF;border-radius:24px;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);padding:0;overflow:hidden;"><sc-for list="{{qs}}" as="q" hint-placeholder-count="6"><div style="display:flex;align-items:center;gap:12px;min-height:58px;padding:0 16px;border-bottom:1px solid #F0ECE5"><div style="flex:1;font-size:16px;font-weight:600">{{q.name}}</div><button role="switch" aria-checked="{{q.on}}" aria-label="{{q.name}}" onClick="{{q.toggle}}" style="width:65px;height:45px;border-radius:22.5px;border:7px solid transparent;margin:-7px;background:{{q.bg}};position:relative;flex:none;background-clip:padding-box"><span style="position:absolute;top:2px;left:{{q.left}};width:27px;height:27px;border-radius:50%;background:#FFFCF8;box-shadow:0 1px 3px rgba(0,0,0,.25)"></span></button></div></sc-for></div><div style="display:flex;align-items:center;justify-content:space-between;margin:30px 2px 4px;min-height:32px"><div style="font-size:20px;font-weight:600;letter-spacing:-0.01em">Consent</div></div><div style="background:#FFFCF8;border:1px solid #ECE7DF;border-radius:24px;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);padding:0;overflow:hidden;"><div style="padding:16px"><div style="font-size:16px;font-weight:600">Consent text</div><div style="font-size:15px;color:#65625D;margin-top:2px">Clients agree and sign by typing their name.</div><input aria-label="Consent text" value="{{ct.value}}" onInput="{{ct.type}}" style="margin-top:12px;height:52px;border-radius:14px;background:#F4F1EB;border:1.5px solid #E3DED5;padding:0 14px;font-size:15px"><div style="margin-top:12px;background:#EFEBE4;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45;color:#4A4743">{{ct.value}}</div></div></div><div style="display:flex;align-items:center;justify-content:space-between;margin:30px 2px 4px;min-height:32px"><div style="font-size:20px;font-weight:600;letter-spacing:-0.01em">Ask again every</div></div><div style="display:flex;gap:8px"><sc-for list="{{again}}" as="a" hint-placeholder-count="4"><button onClick="{{a.pick}}" aria-pressed="{{a.on}}" style="height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;background:{{a.bg}};color:{{a.fg}};border:1.5px solid {{a.bd}};">{{a.label}}</button></sc-for></div><div style="margin-top:20px"><a href="Cl-4-Intake.dc.html" style="height:56px;border-radius:18px;background:#FFFCF8;border:1px solid #D9D4CB;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;width:100%;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.5 3.5 5.5 3.5 8.5s-1 6-3.5 8.5c-2.5-2.5-3.5-5.5-3.5-8.5s1-6 3.5-8.5z"/></svg>Preview as client</a></div></div><div style="padding:12px 20px 34px;background:linear-gradient(to top,#F8F6F2 70%,rgba(248,246,242,0));" class="m-bar"><button onClick="{{save}}" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">{{saveLabel}}</button></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sw = (on) => ({ on: on, bg: on ? '#6E8266' : '#D5D0C7', left: on ? '22px' : '2px' });
    const cs = (on) => ({ on: on, bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : '#242321', bd: on ? '#242321' : '#E3DED5' });

    const names = ['Allergies', 'Medication', 'Pregnant or breastfeeding', 'Skin conditions', 'Recent procedures', 'Sun exposure'];
    const on = st.on || {}; const get = (i) => (on[i] === undefined ? i < 4 : on[i]);
    const ag = st.ag || '12 months';
    const ct = st.ct === undefined ? 'I understand the treatment, I shared my health information honestly, and I agree to be treated.' : st.ct;
    return {
      qs: names.map((n, i) => ({ name: n, ...sw(get(i)), toggle: () => this.setState({ on: { ...on, [i]: !get(i) }, saved: false }) })),
      ct: { value: ct, type: (e) => this.setState({ ct: e.target.value, saved: false }) },
      again: ['6 months', '12 months', '24 months'].map((a) => ({ label: a, ...cs(ag === a), pick: () => this.setState({ ag: a }) })),
      saveLabel: st.saved ? 'Saved' : 'Save changes', save: () => this.setState({ saved: true })
    };
  }
}
</script>
</body>
</html>
