<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#242321;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,textarea{border:0;outline:none;padding:0;width:100%;background:none}
a{color:inherit;text-decoration:none}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.ph{background:repeating-linear-gradient(135deg,#E9E3D9 0 8px,#EFEAE1 8px 16px)}
.tn{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
a:focus-visible,button:focus-visible{outline:3px solid #9A5A6C;outline-offset:2px}
/*motion v1*/
@media (prefers-reduced-motion:no-preference){
:root{--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.3,1.25,.5,1)}
@keyframes mRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes mPop{0%{transform:scale(.45);opacity:0}58%{transform:scale(1.09);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mSheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes mDrift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(6%,5%,0) scale(1.12)}}
@keyframes mDot{0%{box-shadow:0 0 0 0 rgba(201,143,159,.6)}70%{box-shadow:0 0 0 8px rgba(201,143,159,0)}100%{box-shadow:0 0 0 0 rgba(201,143,159,0)}}
button,a{-webkit-tap-highlight-color:transparent;transition:transform .24s var(--ease),background-color .24s ease,color .24s ease,border-color .24s ease,box-shadow .3s ease,opacity .24s ease,filter .24s ease}
button:active,a:active{transform:scale(.97)}
button[style*="width:100%"]:active,a[style*="width:100%"]:active,a[style*="display:flex"]:active{transform:scale(.985)}
.m-scrim:active{transform:none}
@media (hover:hover){
button:hover,a:hover{filter:brightness(.975)}
button[style*="background:#242321"]:hover,a[style*="background:#242321"]:hover{filter:brightness(1.22)}
}
button[role="switch"]{transition:background-color .3s var(--ease),transform .2s var(--ease)}
button[role="switch"]>span{transition:left .34s var(--soft),box-shadow .3s ease}
button[role="switch"][aria-checked="true"]>span{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.0)}
.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}
.m-scrim{animation:mFade .28s ease backwards;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#161514;overflow:hidden;color:#FFFCF8"><div style="position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 45%,#4A433E 0%,#2A2624 55%,#161514 100%)"></div><div style="position:absolute;left:130px;top:150px;width:1px;height:560px;background:rgba(255,255,255,.14)"></div><div style="position:absolute;left:260px;top:150px;width:1px;height:560px;background:rgba(255,255,255,.14)"></div><div style="position:absolute;left:0;top:336px;width:390px;height:1px;background:rgba(255,255,255,.14)"></div><div style="position:absolute;left:0;top:522px;width:390px;height:1px;background:rgba(255,255,255,.14)"></div><div style="position:absolute;left:85px;top:215px;width:220px;height:300px;border-radius:50%;border:2px dashed rgba(255,255,255,.6)"></div><sc-if value="{{ghost}}" hint-placeholder-val="{{false}}"><div style="position:absolute;left:97px;top:205px;width:220px;height:300px;border-radius:50%;border:2px solid rgba(201,143,159,.7);background:rgba(201,143,159,.10)"></div></sc-if><div style="position:absolute;left:0;right:0;top:0;padding:62px 20px 0;display:flex;align-items:center;justify-content:space-between"><a href="Tx-6-Photos.dc.html" aria-label="Close camera" style="width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFCF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></a><div style="display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px"><sc-for list="{{sides}}" as="s" hint-placeholder-count="2"><button onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="height:44px;padding:0 18px;border-radius:22px;font-size:15px;font-weight:600;background:{{s.bg}};color:{{s.fg}}">{{s.label}}</button></sc-for></div><button onClick="{{toggleFlash}}" aria-label="Flash" aria-pressed="{{flash}}" style="width:44px;height:44px;border-radius:22px;background:{{flashBg}};color:{{flashFg}};display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3.5 6.5 13H12l-1 7.5L17.5 11H12z"/></svg></button></div><div style="position:absolute;left:0;right:0;bottom:0;padding:0 24px 40px"><div style="display:flex;justify-content:center"><span style="height:34px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.14);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFCF8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>Saved only in Bello, not in your camera roll</span></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:22px"><button onClick="{{toggleGhost}}" aria-pressed="{{ghost}}" style="width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600"><span style="width:48px;height:48px;border-radius:14px;background:{{ghostBg}};display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="m5 17 4.5-4 3 3 3-3L19 16"/></svg></span>Ghost</button><button onClick="{{shoot}}" aria-label="Take photo" style="width:82px;height:82px;border-radius:41px;border:4px solid #FFFCF8;display:flex;align-items:center;justify-content:center"><span style="width:62px;height:62px;border-radius:31px;background:#FFFCF8"></span></button><button onClick="{{flip}}" aria-label="Flip camera" style="width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600"><span style="width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFCF8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11a6 6 0 0 1 10-4l3 3M19 13a6 6 0 0 1-10 4l-3-3"/><path d="M18 6v4h-4M6 18v-4h4"/></svg></span>{{camLabel}}</button></div></div><sc-if value="{{shot}}" hint-placeholder-val="{{false}}"><div style="position:absolute;inset:0;background:#F8F6F2;color:#242321;display:flex;flex-direction:column;z-index:10"><div style="padding:62px 20px 0"><div style="font-size:17px;font-weight:600;text-align:center;height:44px;display:flex;align-items:center;justify-content:center">Review photo</div></div><div style="flex:1;padding:8px 20px 0"><div class="ph" style="height:380px;border-radius:28px;position:relative"><span style="position:absolute;left:14px;top:14px"><span style="height:26px;padding:0 10px;border-radius:999px;background:#F7ECEE;color:#8A4C5F;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:#8A4C5F;flex:none"></span>{{sideLabel}}</span></span></div><div style="font-size:15px;font-weight:600;margin:20px 2px 10px">Who can see this photo?</div><div style="display:flex;gap:8px;flex-wrap:wrap"><sc-for list="{{consents}}" as="k" hint-placeholder-count="4"><button onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;background:{{k.bg}};color:{{k.fg}};border:1.5px solid {{k.bd}};">{{k.label}}</button></sc-for></div><div style="font-size:13px;line-height:1.45;color:#65625D;margin:10px 2px 0">Portfolio use needs the client's OK. Ana's consent from Sep 12 covers private records only.</div></div><div style="padding:12px 20px 34px;background:linear-gradient(to top,#F8F6F2 70%,rgba(248,246,242,0));" class="m-bar"><div style="display:flex;gap:10px"><div style="flex:1"><button onClick="{{retake}}" style="height:56px;border-radius:18px;background:#FFFCF8;border:1px solid #D9D4CB;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;width:100%;">Retake</button></div><div style="flex:1.4"><a href="Tx-6-Photos.dc.html" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">Save photo</a></div></div></div></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sw = (on) => ({ on: on, bg: on ? '#6E8266' : '#D5D0C7', left: on ? '22px' : '2px' });
    const cs = (on) => ({ on: on, bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : '#242321', bd: on ? '#242321' : '#E3DED5' });

    const side = st.side || 'Before'; const flash = !!st.flash; const ghost = !!st.ghost; const cons = st.cons || 'Private only'; const back = !!st.back;
    return {
      sides: ['Before', 'After'].map((s) => ({ label: s, on: side === s, bg: side === s ? '#FFFCF8' : 'transparent', fg: side === s ? '#242321' : '#FFFCF8', pick: () => this.setState({ side: s }) })),
      flash: flash, flashBg: flash ? '#FFFCF8' : 'rgba(255,255,255,.14)', flashFg: flash ? '#242321' : '#FFFCF8', toggleFlash: () => this.setState({ flash: !flash }),
      ghost: ghost, ghostBg: ghost ? 'rgba(201,143,159,.55)' : 'rgba(255,255,255,.14)', toggleGhost: () => this.setState({ ghost: !ghost }),
      camLabel: back ? 'Back' : 'Front', flip: () => this.setState({ back: !back }),
      shot: !!st.shot, shoot: () => this.setState({ shot: true }), retake: () => this.setState({ shot: false }), sideLabel: side,
      consents: ['Private only', 'OK for portfolio'].map((c) => ({ label: c, ...cs(cons === c), pick: () => this.setState({ cons: c }) }))
    };
  }
}
</script>
