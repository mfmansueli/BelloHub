<style>

}

.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}

.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>

<div style="position:relative;width:390px;height:844px;background:#F8F6F2;overflow:hidden;display:flex;flex-direction:column"><div style="padding:62px 20px 0"><div style="display:flex;align-items:center;justify-content:space-between;height:44px"><a href="More.dc.html" style="display:flex;align-items:center;height:44px;margin-left:-8px;padding-right:12px;font-size:17px;color:#9A5A6C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg>More</a></div><div style="font-family:'Fraunces',Georgia,serif;font-size:34px;line-height:1.05;letter-spacing:-0.015em;font-weight:500;color:#242321;margin-top:6px">Record fields</div><div style="font-size:15px;line-height:1.4;color:#65625D;margin-top:6px">What you want to remember about each client. The voice assistant fills these in.</div></div><div class="noscroll" style="flex:1;overflow-y:auto;padding:8px 20px 24px"><div class="noscroll" style="display:flex;gap:8px;overflow-x:auto;margin:16px -20px 0;padding:0 20px"><sc-for list="{{profs}}" as="p" hint-placeholder-count="4"><button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="height:44px;padding:0 16px;border-radius:22px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;background:{{p.bg}};color:{{p.fg}};border:1.5px solid {{p.bd}};flex:none">{{p.label}}</button></sc-for></div><div style="display:flex;align-items:center;justify-content:space-between;margin:22px 2px 4px;min-height:32px"><div style="font-size:20px;font-weight:600;letter-spacing:-0.01em">Treatment record</div></div><div style="background:#FFFCF8;border:1px solid #ECE7DF;border-radius:24px;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);padding:0;overflow:hidden;"><sc-for list="{{fields}}" as="f" hint-placeholder-count="8"><div style="display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-bottom:1px solid #F0ECE5"><div style="flex:1;font-size:16px;font-weight:{{f.weight}}">{{f.name}}</div><sc-if value="{{f.custom}}" hint-placeholder-val="{{false}}"><span style="height:26px;padding:0 10px;border-radius:999px;background:#F7ECEE;color:#8A4C5F;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap">Yours</span></sc-if><button role="switch" aria-checked="{{f.on}}" aria-label="{{f.name}}" onClick="{{f.toggle}}" style="width:65px;height:45px;border-radius:22.5px;border:7px solid transparent;margin:-7px;background:{{f.bg}};position:relative;flex:none;background-clip:padding-box"><span style="position:absolute;top:2px;left:{{f.left}};width:27px;height:27px;border-radius:50%;background:#FFFCF8;box-shadow:0 1px 3px rgba(0,0,0,.25)"></span></button></div></sc-for><button onClick="{{openAdd}}" style="width:100%;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;font-size:16px;font-weight:600;color:#9A5A6C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add your own field</button></div><div style="display:flex;align-items:center;justify-content:space-between;margin:30px 2px 4px;min-height:32px"><div style="font-size:20px;font-weight:600;letter-spacing:-0.01em">Before the first visit</div></div><div style="background:#FFFCF8;border:1px solid #ECE7DF;border-radius:24px;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);padding:0;overflow:hidden;"><sc-for list="{{intake}}" as="i" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:12px;min-height:64px;padding:0 16px;border-bottom:1px solid #F0ECE5"><div style="flex:1"><div style="font-size:16px;font-weight:600">{{i.name}}</div><div style="font-size:13px;color:#65625D">{{i.desc}}</div></div><button role="switch" aria-checked="{{i.on}}" aria-label="{{i.name}}" onClick="{{i.toggle}}" style="width:65px;height:45px;border-radius:22.5px;border:7px solid transparent;margin:-7px;background:{{i.bg}};position:relative;flex:none;background-clip:padding-box"><span style="position:absolute;top:2px;left:{{i.left}};width:27px;height:27px;border-radius:50%;background:#FFFCF8;box-shadow:0 1px 3px rgba(0,0,0,.25)"></span></button></div></sc-for><a href="FormTemplates.dc.html" style="display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:64px;"><span style="width:40px;height:40px;border-radius:14px;background:#F7ECEE;color:#8A4C5F;display:inline-flex;align-items:center;justify-content:center;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V5A1.5 1.5 0 0 1 7.5 3.5z"/><path d="M14 3.5V8h4M9 12.5h6M9 15.5h4"/></svg></span><span style="flex:1;min-width:0"><span style="display:block;font-size:16px;font-weight:600">Edit client forms</span><span style="display:block;font-size:15px;color:#65625D">Questions and consent text</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C8984" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></a></div></div><div style="padding:12px 20px 34px;background:linear-gradient(to top,#F8F6F2 70%,rgba(248,246,242,0));" class="m-bar"><button onClick="{{save}}" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">{{saveLabel}}</button></div><sc-if value="{{addOpen}}" hint-placeholder-val="{{false}}"><div style="position:absolute;inset:0;background:rgba(36,35,33,.38);display:flex;flex-direction:column;justify-content:flex-end;z-index:20" class="m-scrim"><div style="background:#FFFCF8;border-radius:30px 30px 0 0;padding:10px 20px 34px;box-shadow:0 -12px 40px -12px rgba(70,45,30,.25)" class="m-sheet"><div style="width:36px;height:5px;border-radius:3px;background:#D9D4CB;margin:0 auto 14px"></div><div style="font-size:20px;font-weight:600">Add your own field</div><div style="margin-top:14px"><div style="font-size:15px;font-weight:600;color:#65625D;margin:0 2px 6px">Field name</div><input aria-label="Field name" placeholder="e.g. Neck tension" value="{{nf.value}}" onInput="{{nf.type}}" style="height:52px;border-radius:14px;background:#F4F1EB;border:1.5px solid #E3DED5;padding:0 14px;font-size:16px"></div><div style="font-size:15px;font-weight:600;color:#65625D;margin:14px 2px 8px">How do you fill it?</div><div style="display:flex;gap:8px"><sc-for list="{{kinds}}" as="k" hint-placeholder-count="4"><button onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;background:{{k.bg}};color:{{k.fg}};border:1.5px solid {{k.bd}};">{{k.label}}</button></sc-for></div><div style="margin-top:16px"><button onClick="{{saveAdd}}" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">Add field</button></div><button onClick="{{closeAdd}}" style="width:100%;height:48px;margin-top:6px;text-align:center;font-size:16px;font-weight:600;color:#65625D">Cancel</button></div></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sw = (on) => ({ on: on, bg: on ? '#6E8266' : '#D5D0C7', left: on ? '22px' : '2px' });
    const cs = (on) => ({ on: on, bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : '#242321', bd: on ? '#242321' : '#E3DED5' });

    const prof = st.prof || 'est'; const off = st.off || {}; const custom = st.custom || {};
    const profs = [['est', 'Esthetician'], ['hair', 'Hair stylist'], ['lash', 'Lash artist'], ['nail', 'Nail artist'], ['mua', 'Makeup artist'], ['tat', 'Tattoo / PMU'], ['bar', 'Barber'], ['mas', 'Massage']];
    const F = {
      est: [['Skin condition', 1], ['Areas', 1], ['Products and actives', 1], ['Protocol', 1], ['Technique', 0], ['Reaction', 1], ['Result', 1], ['Aftercare', 1]],
      hair: [['Hair condition', 1], ['Previous color', 1], ['Formula', 1], ['Developer', 1], ['Technique', 1], ['Processing time', 1], ['Products', 0], ['Result', 1], ['Preferences', 1]],
      lash: [['Set', 1], ['Curl', 1], ['Length', 1], ['Thickness', 1], ['Mapping', 1], ['Adhesive', 1], ['Retention', 1], ['Preferences', 0]],
      nail: [['Nail condition', 1], ['Shape', 1], ['Length', 1], ['Color', 1], ['Product system', 1], ['Technique', 0], ['Durability', 1]],
      mua: [['Event', 1], ['Look', 1], ['Skin preparation', 0], ['Foundation', 1], ['Shade', 1], ['Products', 1], ['Preferences', 1]],
      tat: [['Design', 1], ['Placement', 1], ['Technique', 1], ['Pigments', 1], ['Tools and materials', 1], ['Session number', 1], ['Healing', 1], ['Follow-up', 1]],
      bar: [['Cut', 1], ['Guard sizes', 1], ['Fade', 1], ['Beard', 1], ['Products', 0], ['Preferences', 1]],
      mas: [['Focus areas', 1], ['Pressure', 1], ['Technique', 1], ['Oils and products', 0], ['Contraindications', 1], ['Result', 1], ['Home care', 0]]
    };
    const IN = { est: [1, 1, 0], hair: [0, 0, 1], lash: [1, 1, 1], nail: [0, 0, 0], mua: [1, 0, 0], tat: [1, 1, 1], bar: [0, 0, 0], mas: [1, 1, 0] };
    const mine = custom[prof] || [];
    const all = F[prof].map((f) => [f[0], f[1], false]).concat(mine.map((m) => [m, 1, true]));
    const fields = all.map((f) => { const k = prof + '|' + f[0]; const on = off[k] === undefined ? !!f[1] : off[k]; return { name: f[0], custom: f[2], weight: on ? 600 : 400, ...sw(on), toggle: () => this.setState({ off: { ...off, [k]: !on }, saved: false }) }; });
    const defs = [['Health history', 'Allergies, medication and conditions'], ['Consent form', 'Signed digitally before the first treatment'], ['Patch test log', 'Date, product and result']];
    const intake = defs.map((d, i) => { const k = 'in|' + prof + '|' + i; const on = off[k] === undefined ? !!IN[prof][i] : off[k]; return { name: d[0], desc: d[1], ...sw(on), toggle: () => this.setState({ off: { ...off, [k]: !on }, saved: false }) }; });
    const nf = st.nf || ''; const kind = st.kind || 'Choices';
    return {
      profs: profs.map((p) => ({ label: p[1], ...cs(prof === p[0]), pick: () => this.setState({ prof: p[0] }) })), fields: fields, intake: intake,
      addOpen: !!st.addOpen, openAdd: () => this.setState({ addOpen: true }), closeAdd: () => this.setState({ addOpen: false }),
      nf: { value: nf, type: (e) => this.setState({ nf: e.target.value }) }, kinds: ['Choices', 'Free text'].map((k) => ({ label: k, ...cs(kind === k), pick: () => this.setState({ kind: k }) })),
      saveAdd: () => this.setState({ custom: nf.trim() ? { ...custom, [prof]: mine.concat([nf.trim()]) } : custom, addOpen: false, nf: '', saved: false }),
      saveLabel: st.saved ? 'Saved' : 'Save changes', save: () => this.setState({ saved: true })
    };
  }
}
</script>
