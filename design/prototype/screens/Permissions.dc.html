<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#242321;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,textarea{border:0;outline:none;padding:0;width:100%;background:none}
a{color:inherit;text-decoration:none}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.ph{background:repeating-linear-gradient(135deg,#E9E3D9 0 8px,#EFEAE1 8px 16px)}
.tn{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
a:focus-visible,button:focus-visible{outline:3px solid #9A5A6C;outline-offset:2px}
/*motion v1*/
@media (prefers-reduced-motion:no-preference){
:root{--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.3,1.25,.5,1)}
@keyframes mRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes mPop{0%{transform:scale(.45);opacity:0}58%{transform:scale(1.09);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mSheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes mDrift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(6%,5%,0) scale(1.12)}}
@keyframes mDot{0%{box-shadow:0 0 0 0 rgba(201,143,159,.6)}70%{box-shadow:0 0 0 8px rgba(201,143,159,0)}100%{box-shadow:0 0 0 0 rgba(201,143,159,0)}}
button,a{-webkit-tap-highlight-color:transparent;transition:transform .24s var(--ease),background-color .24s ease,color .24s ease,border-color .24s ease,box-shadow .3s ease,opacity .24s ease,filter .24s ease}
button:active,a:active{transform:scale(.97)}
button[style*="width:100%"]:active,a[style*="width:100%"]:active,a[style*="display:flex"]:active{transform:scale(.985)}
.m-scrim:active{transform:none}
@media (hover:hover){
button:hover,a:hover{filter:brightness(.975)}
button[style*="background:#242321"]:hover,a[style*="background:#242321"]:hover{filter:brightness(1.22)}
}
button[role="switch"]{transition:background-color .3s var(--ease),transform .2s var(--ease)}
button[role="switch"]>span{transition:left .34s var(--soft),box-shadow .3s ease}
button[role="switch"][aria-checked="true"]>span{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.0)}
.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}
.m-scrim{animation:mFade .28s ease backwards;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#F8F6F2;overflow:hidden;display:flex;flex-direction:column"><div style="flex:1;padding:62px 24px 0;display:flex;flex-direction:column;align-items:center;text-align:center"><div style="height:44px"></div><div style="margin-top:50px"><sc-if value="{{ic.mic}}" hint-placeholder-val="{{false}}"><span style="width:72px;height:72px;border-radius:25px;background:#F7ECEE;color:#8A4C5F;display:inline-flex;align-items:center;justify-content:center;flex:none"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg></span></sc-if><sc-if value="{{ic.bell}}" hint-placeholder-val="{{false}}"><span style="width:72px;height:72px;border-radius:25px;background:#F7ECEE;color:#8A4C5F;display:inline-flex;align-items:center;justify-content:center;flex:none"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg></span></sc-if><sc-if value="{{ic.camera}}" hint-placeholder-val="{{false}}"><span style="width:72px;height:72px;border-radius:25px;background:#F7ECEE;color:#8A4C5F;display:inline-flex;align-items:center;justify-content:center;flex:none"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5a2 2 0 0 1 2-2h1.6l1.4-2h6l1.4 2H18a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.4"/></svg></span></sc-if><sc-if value="{{ic.clients}}" hint-placeholder-val="{{false}}"><span style="width:72px;height:72px;border-radius:25px;background:#F7ECEE;color:#8A4C5F;display:inline-flex;align-items:center;justify-content:center;flex:none"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.7 5.5-4.7s4.9 1.7 5.5 4.7"/><path d="M15.5 5.6a3 3 0 0 1 0 5.8M17.5 14.6c1.8.6 3 2.2 3.3 4.4"/></svg></span></sc-if></div><div style="font-family:'Fraunces',Georgia,serif;font-size:34px;line-height:1.08;margin-top:30px;font-weight:500;letter-spacing:-0.015em">{{cur.title}}</div><div style="font-size:16px;line-height:1.5;color:#65625D;margin-top:12px;max-width:310px">{{cur.text}}</div><div style="display:flex;gap:6px;justify-content:center;margin-top:18px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="width:{{d.w}};height:6px;border-radius:3px;background:{{d.bg}}"></span></sc-for></div></div><div style="padding:12px 20px 34px;background:linear-gradient(to top,#F8F6F2 70%,rgba(248,246,242,0));" class="m-bar"><button onClick="{{ask}}" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">{{cur.allow}}</button><button onClick="{{skip}}" style="width:100%;margin-top:6px;min-height:48px;text-align:center;font-size:16px;font-weight:600;color:#65625D">Not now</button></div><sc-if value="{{isDone}}" hint-placeholder-val="{{false}}"><div style="position:absolute;inset:0;background:#F8F6F2;z-index:40;display:flex;flex-direction:column;padding:62px 24px 34px"><div style="height:44px"></div><div style="margin-top:50px;width:72px;height:72px;border-radius:50%;background:#E6ECE0;color:#45573F;display:flex;align-items:center;justify-content:center" class="m-pop"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="m-check"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div><div style="font-family:'Fraunces',Georgia,serif;font-size:40px;line-height:1.05;letter-spacing:-0.015em;font-weight:500;color:#242321;margin-top:24px">All set.</div><div style="font-size:15px;line-height:1.4;color:#65625D;margin-top:8px">You can change any of this later in Privacy and security.</div><div style="flex:1"></div><a href="Onb-7-Ready.dc.html" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">Continue</a></div></sc-if><sc-if value="{{sys}}" hint-placeholder-val="{{false}}"><div style="position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:30" class="m-scrim"><div style="width:270px;border-radius:16px;background:rgba(246,246,246,.97);text-align:center;overflow:hidden"><div style="padding:18px 16px 16px"><div style="font-size:17px;font-weight:600;line-height:1.3">"{{cur.dlg}}"</div><div style="font-size:13px;line-height:1.35;margin-top:6px;color:#3C3C43">{{cur.why}}</div></div><div style="display:flex;border-top:1px solid #C6C6C8"><button onClick="{{deny}}" style="flex:1;height:44px;text-align:center;font-size:17px;color:#0062CC;border-right:1px solid #C6C6C8">Don't allow</button><button onClick="{{allow}}" style="flex:1;height:44px;text-align:center;font-size:17px;font-weight:600;color:#0062CC">OK</button></div></div></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sw = (on) => ({ on: on, bg: on ? '#6E8266' : '#D5D0C7', left: on ? '22px' : '2px' });
    const cs = (on) => ({ on: on, bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : '#242321', bd: on ? '#242321' : '#E3DED5' });

    const steps = [
      { ic: 'mic', name: 'Microphone', title: 'Talk, and the record writes itself.', text: 'Bello Hub listens only while you record a treatment, then organizes what you said. You review everything before it is saved.', allow: 'Allow microphone', dlg: 'Bello Hub would like to access the microphone', why: 'To record treatment notes by voice.' },
      { ic: 'bell', name: 'Notifications', title: 'Know when something needs you.', text: 'New bookings, cancellations and client check-ins. Names stay hidden on your lock screen if you prefer.', allow: 'Allow notifications', dlg: 'Bello Hub would like to send you notifications', why: 'Bookings, cancellations and client replies.' },
      { ic: 'camera', name: 'Camera', title: 'Photos that stay private.', text: 'Take before and after photos inside Bello Hub. They are never saved to your camera roll.', allow: 'Allow camera', dlg: 'Bello Hub would like to access the camera', why: 'To take treatment photos.' },
      { ic: 'clients', name: 'Contacts', title: 'Bring your clients along.', text: 'Choose contacts to import. We only read the ones you select.', allow: 'Allow contacts', dlg: 'Bello Hub would like to access your contacts', why: 'To import clients you choose.' }
    ];
    const i = st.i || 0; const cur = steps[i];
    const adv = () => { if (i >= steps.length - 1) { this.setState({ sys: false, i: i, done: true }); } else { this.setState({ i: i + 1, sys: false }); } };
    const ic = {}; steps.forEach((s) => { ic[s.ic] = s.ic === cur.ic; });
    return {
      isDone: !!st.done, cur: cur, ic: ic, sys: !!st.sys, dots: steps.map((s, k) => ({ w: k === i ? '22px' : '6px', bg: k === i ? '#242321' : '#D5D0C7' })),
      ask: () => this.setState({ sys: true }), allow: adv, deny: adv, skip: adv
    };
  }
}
</script>
