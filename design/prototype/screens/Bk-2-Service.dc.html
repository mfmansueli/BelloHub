<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select service</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#242321;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
a{color:inherit;text-decoration:none}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.tn{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
a:focus-visible,button:focus-visible{outline:3px solid #9A5A6C;outline-offset:2px}
/*motion v1*/
@media (prefers-reduced-motion:no-preference){
:root{--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.3,1.25,.5,1)}
@keyframes mRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes mPop{0%{transform:scale(.45);opacity:0}58%{transform:scale(1.09);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mSheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes mDrift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(6%,5%,0) scale(1.12)}}
@keyframes mDot{0%{box-shadow:0 0 0 0 rgba(201,143,159,.6)}70%{box-shadow:0 0 0 8px rgba(201,143,159,0)}100%{box-shadow:0 0 0 0 rgba(201,143,159,0)}}
button,a{-webkit-tap-highlight-color:transparent;transition:transform .24s var(--ease),background-color .24s ease,color .24s ease,border-color .24s ease,box-shadow .3s ease,opacity .24s ease,filter .24s ease}
button:active,a:active{transform:scale(.97)}
button[style*="width:100%"]:active,a[style*="width:100%"]:active,a[style*="display:flex"]:active{transform:scale(.985)}
.m-scrim:active{transform:none}
@media (hover:hover){
button:hover,a:hover{filter:brightness(.975)}
button[style*="background:#242321"]:hover,a[style*="background:#242321"]:hover{filter:brightness(1.22)}
}
button[role="switch"]{transition:background-color .3s var(--ease),transform .2s var(--ease)}
button[role="switch"]>span{transition:left .34s var(--soft),box-shadow .3s ease}
button[role="switch"][aria-checked="true"]>span{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.0)}
.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}
.m-scrim{animation:mFade .28s ease backwards;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#F8F6F2;overflow:hidden">
<div class="noscroll" style="position:absolute;inset:0;overflow-y:auto;padding:62px 20px 190px">

<div style="display:flex;align-items:center;gap:12px;height:44px">
<a href="Bk-1-Page.dc.html" aria-label="Back" style="width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg></a>
<div style="flex:1;display:flex;gap:6px"><div style="flex:1;height:4px;border-radius:2px;background:#242321"></div><div style="flex:1;height:4px;border-radius:2px;background:#DDD8CF"></div><div style="flex:1;height:4px;border-radius:2px;background:#DDD8CF"></div><div style="flex:1;height:4px;border-radius:2px;background:#DDD8CF"></div><div style="flex:1;height:4px;border-radius:2px;background:#DDD8CF"></div></div>
<span style="width:20px"></span>
</div>

<div style="margin-top:24px;font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:500;letter-spacing:-0.015em;line-height:1.1">Choose a service</div>
<div style="font-size:16px;color:#65625D;margin-top:6px">with Maria Beauty</div>

<div style="margin-top:20px;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{items}}" as="s" hint-placeholder-count="4">
<button onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="display:flex;align-items:center;gap:14px;min-height:76px;border-radius:20px;padding:12px 16px;background:{{s.bg}};border:{{s.bd}}">
<span style="width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid {{s.ring}};background:{{s.dot}}"><span style="width:8px;height:8px;border-radius:50%;background:#FFFCF8;opacity:{{s.ck}}"></span></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:17px;font-weight:600">{{s.name}}</span><span style="display:block;font-size:15px;color:#65625D;margin-top:2px">{{s.meta}}</span></span>
<span style="font-size:16px;font-weight:600;text-align:right">{{s.price}}</span>
</button>
</sc-for>
</div>
<sc-if value="{{hasAO}}" hint-placeholder-val="{{true}}"><div style="margin-top:22px"><div style="font-size:17px;font-weight:600">Add to your visit</div><div style="font-size:15px;color:#65625D;margin-top:2px">Optional extras. They add time.</div><div style="margin-top:12px;background:#FFFCF8;border:1px solid #ECE7DF;border-radius:20px;overflow:hidden"><sc-for list="{{addons}}" as="a" hint-placeholder-count="3"><button role="checkbox" aria-checked="{{a.on}}" onClick="{{a.pick}}" style="width:100%;display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 16px;border-bottom:{{a.line}}"><span style="width:26px;height:26px;border-radius:8px;border:1.5px solid {{a.bd}};background:{{a.bg}};color:#FFFCF8;display:flex;align-items:center;justify-content:center;flex:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span><span style="flex:1;min-width:0"><span style="display:block;font-size:16px;font-weight:600">{{a.name}}</span><span style="display:block;font-size:15px;color:#65625D">{{a.meta}}</span></span><span style="font-size:15px;font-weight:600">{{a.price}}</span></button></sc-for></div></div></sc-if>

</div>

<div style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 34px;background:rgba(255,252,248,0.96);border-top:1px solid #ECE7DF">
<div style="margin-bottom:12px"><div style="font-size:16px;font-weight:600;line-height:1.3">{{selName}}</div><div class="tn" style="font-size:15px;color:#65625D;margin-top:2px">{{selMeta}}</div></div>
<a href="{{nextHref}}" style="height:56px;border-radius:18px;background:#242321;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);color:#FFFCF8;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600">Continue</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"multiPro":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.sel) || 'brazil';
    const defs = [
      ['glow', 'Glow Facial', '60 min', 'R$70'],
      ['brazil', 'Brazilian Glow', '90 min', 'R$120'],
      ['deep', 'Deep Cleansing', '75 min', 'From R$80'],
      ['p360', 'Protocol 360', '120 min', 'Price on request']
    ];
    const items = defs.map((d) => {
      const on = sel === d[0];
      return {
        name: d[1], meta: d[2], price: d[3], on: on,
        bg: '#FFFCF8', bd: on ? '1.5px solid #242321' : '1.5px solid #ECE7DF',
        ring: on ? '#242321' : '#CFC9BF', dot: on ? '#242321' : 'transparent', ck: on ? 1 : 0,
        pick: () => this.setState({ sel: d[0] })
      };
    });
    const cur = defs.filter((d) => d[0] === sel)[0];
    const st = this.state || {}; const HS = this.hubState || {}; const AOS = HS.AddOns || {}; const offOn = AOS.on || {}; const offDef = { brow: true, led: true, mask: true, ext: false };
    const AOD = [['brow', 'Eyebrow tint', 15, 20], ['led', 'LED light', 15, 25], ['mask', 'Hand and arm massage', 10, 15], ['ext', 'Extractions', 20, 30]];
    const offered = AOD.filter((a) => (offOn[a[0]] === undefined ? offDef[a[0]] : offOn[a[0]])).concat((AOS.extra || []).map((e, i) => ['x' + i, e.name, e.min, 0]));
    const ao = st.ao || {}; const picked = offered.filter((a) => ao[a[0]]);
    const addons = offered.map((a, i) => ({ name: a[1], meta: '+' + a[2] + ' min', price: a[3] ? 'R$' + a[3] : '', on: !!ao[a[0]], bg: ao[a[0]] ? '#242321' : 'transparent', bd: ao[a[0]] ? '#242321' : '#BDB7AD', line: i < offered.length - 1 ? '1px solid #F0ECE5' : 'none', pick: () => this.setState({ ao: { ...ao, [a[0]]: !ao[a[0]] } }) }));
    const mins = parseInt(cur[2], 10) + picked.reduce((t, a) => t + a[2], 0); const pm = /^R\$(\d+)$/.exec(cur[3]); const addP = picked.reduce((t, a) => t + a[3], 0);
    const priceT = pm ? 'R$' + (parseInt(pm[1], 10) + addP) : cur[3] + (addP ? ' + R$' + addP : '');
    return {
      hasAO: offered.length > 0, addons, items: items, selName: cur[1] + (picked.length ? ' + ' + picked.map((a) => a[1]).join(' and ') : ''), selMeta: mins + ' min · ' + priceT,
      nextHref: this.props.multiPro ? 'Bk-3-Professional.dc.html' : 'Bk-4-DateTime.dc.html'
    };
  }
}
</script>
</body>
</html>
