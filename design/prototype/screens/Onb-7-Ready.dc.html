<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#242321;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
a{color:inherit;text-decoration:none}
.tn{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
a:focus-visible,button:focus-visible{outline:3px solid #9A5A6C;outline-offset:2px}
/*motion v1*/
@media (prefers-reduced-motion:no-preference){
:root{--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.3,1.25,.5,1)}
@keyframes mRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes mPop{0%{transform:scale(.45);opacity:0}58%{transform:scale(1.09);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mSheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes mDrift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(6%,5%,0) scale(1.12)}}
@keyframes mDot{0%{box-shadow:0 0 0 0 rgba(201,143,159,.6)}70%{box-shadow:0 0 0 8px rgba(201,143,159,0)}100%{box-shadow:0 0 0 0 rgba(201,143,159,0)}}
button,a{-webkit-tap-highlight-color:transparent;transition:transform .24s var(--ease),background-color .24s ease,color .24s ease,border-color .24s ease,box-shadow .3s ease,opacity .24s ease,filter .24s ease}
button:active,a:active{transform:scale(.97)}
button[style*="width:100%"]:active,a[style*="width:100%"]:active,a[style*="display:flex"]:active{transform:scale(.985)}
.m-scrim:active{transform:none}
@media (hover:hover){
button:hover,a:hover{filter:brightness(.975)}
button[style*="background:#242321"]:hover,a[style*="background:#242321"]:hover{filter:brightness(1.22)}
}
button[role="switch"]{transition:background-color .3s var(--ease),transform .2s var(--ease)}
button[role="switch"]>span{transition:left .34s var(--soft),box-shadow .3s ease}
button[role="switch"][aria-checked="true"]>span{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.0)}
.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}
.m-scrim{animation:mFade .28s ease backwards;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#F8F6F2;overflow:hidden;display:flex;flex-direction:column;padding:62px 24px 34px">

<div style="height:44px"></div>
<div style="margin-top:36px;width:64px;height:64px;border-radius:50%;background:#EEF2EA;color:#56684F;display:flex;align-items:center;justify-content:center" class="m-pop"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="m-check"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
<div style="margin-top:24px;font-family:'Fraunces',Georgia,serif;font-size:40px;line-height:1.08;font-weight:500;letter-spacing:-0.015em">Your Bello Hub is ready.</div>
<div style="font-size:17px;color:#65625D;margin-top:10px;line-height:1.4">Maria, your workspace is set up for estheticians. It will fill up as clients book.</div>

<div style="margin-top:32px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
<div style="background:#FFFCF8;border:1px solid #ECE7DF;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);border-radius:24px;padding:16px 14px"><div style="font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:500;letter-spacing:-0.015em">0</div><div style="font-size:13px;color:#65625D;margin-top:2px">Appointments today</div></div>
<div style="background:#FFFCF8;border:1px solid #ECE7DF;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);border-radius:24px;padding:16px 14px"><div style="font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:500;letter-spacing:-0.015em">0</div><div style="font-size:13px;color:#65625D;margin-top:2px">Clients</div></div>
<div style="background:#FFFCF8;border:1px solid #ECE7DF;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);border-radius:24px;padding:16px 14px"><div style="font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:500;letter-spacing:-0.015em">0</div><div style="font-size:13px;color:#65625D;margin-top:2px">Follow-ups</div></div>
</div>

<div style="margin-top:16px;background:#FFFCF8;border:1px solid #ECE7DF;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);border-radius:24px;padding:16px;display:flex;align-items:center;gap:12px">
<div style="width:44px;height:44px;border-radius:14px;background:#F4E6E9;color:#8A4C5F;display:flex;align-items:center;justify-content:center;flex:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></div>
<div style="flex:1;min-width:0"><div style="font-size:13px;color:#65625D">Your booking link</div><div style="font-size:16px;font-weight:600">bellohub.app/maria</div></div>
<button onClick="{{copy}}" style="height:44px;padding:0 14px;border-radius:12px;background:#EEEAE3;font-size:15px;font-weight:600">{{copyLabel}}</button>
</div>

<a href="ImportClients.dc.html" style="margin-top:12px;background:#FFFCF8;border:1px solid #ECE7DF;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);border-radius:24px;padding:16px;display:flex;align-items:center;gap:12px"><div style="width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#F3E7DA,#E2CDB6);color:#4A4036;display:flex;align-items:center;justify-content:center;flex:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="9" r="3.5"/><path d="M3.5 19a6.5 6.5 0 0 1 13 0M18 8v6M15 11h6"/></svg></div><div style="flex:1"><div style="font-size:16px;font-weight:600">Import your clients</div><div style="font-size:13px;color:#65625D">From your phone or a spreadsheet</div></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C8984" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 6 6 6-6 6"/></svg></a>

<div style="flex:1"></div>
<a href="Home.dc.html" style="height:56px;border-radius:18px;background:#242321;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);color:#FFFCF8;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600">Go to Home</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { copyLabel: (this.state && this.state.copied) ? "Copied" : "Copy", copy: () => this.setState({ copied: true }) }; }
}
</script>
</body>
</html>
