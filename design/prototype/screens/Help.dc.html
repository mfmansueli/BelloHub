<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#242321;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,textarea{border:0;outline:none;padding:0;width:100%;background:none}
a{color:inherit;text-decoration:none}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.ph{background:repeating-linear-gradient(135deg,#E9E3D9 0 8px,#EFEAE1 8px 16px)}
.tn{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
a:focus-visible,button:focus-visible{outline:3px solid #9A5A6C;outline-offset:2px}
/*motion v1*/
@media (prefers-reduced-motion:no-preference){
:root{--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.3,1.25,.5,1)}
@keyframes mRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes mPop{0%{transform:scale(.45);opacity:0}58%{transform:scale(1.09);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mSheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes mDrift{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(6%,5%,0) scale(1.12)}}
@keyframes mDot{0%{box-shadow:0 0 0 0 rgba(201,143,159,.6)}70%{box-shadow:0 0 0 8px rgba(201,143,159,0)}100%{box-shadow:0 0 0 0 rgba(201,143,159,0)}}
button,a{-webkit-tap-highlight-color:transparent;transition:transform .24s var(--ease),background-color .24s ease,color .24s ease,border-color .24s ease,box-shadow .3s ease,opacity .24s ease,filter .24s ease}
button:active,a:active{transform:scale(.97)}
button[style*="width:100%"]:active,a[style*="width:100%"]:active,a[style*="display:flex"]:active{transform:scale(.985)}
.m-scrim:active{transform:none}
@media (hover:hover){
button:hover,a:hover{filter:brightness(.975)}
button[style*="background:#242321"]:hover,a[style*="background:#242321"]:hover{filter:brightness(1.22)}
}
button[role="switch"]{transition:background-color .3s var(--ease),transform .2s var(--ease)}
button[role="switch"]>span{transition:left .34s var(--soft),box-shadow .3s ease}
button[role="switch"][aria-checked="true"]>span{box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.0)}
.noscroll>*{animation:mRise .56s var(--ease) backwards}
.noscroll>*:nth-child(2){animation-delay:0.040s}.noscroll>*:nth-child(3){animation-delay:0.080s}.noscroll>*:nth-child(4){animation-delay:0.120s}.noscroll>*:nth-child(5){animation-delay:0.160s}.noscroll>*:nth-child(6){animation-delay:0.200s}.noscroll>*:nth-child(7){animation-delay:0.240s}.noscroll>*:nth-child(8){animation-delay:0.280s}.noscroll>*:nth-child(9){animation-delay:0.320s}.noscroll>*:nth-child(n+10){animation-delay:.36s}
.m-bar{animation:mRise .5s .18s var(--ease) backwards}
.m-scrim{animation:mFade .28s ease backwards;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.m-sheet{animation:mSheet .46s var(--ease) backwards}
.m-pop{position:relative;animation:mPop .62s .1s var(--soft) backwards}
.m-pop::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none;animation:mRing 1.1s .45s var(--ease) 1 both}
.m-check path{stroke-dasharray:26;stroke-dashoffset:26;animation:mDraw .5s .38s var(--ease) forwards}
.m-hero{position:relative;overflow:hidden;isolation:isolate}
.m-hero::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 74% 18%,rgba(232,180,196,.20),transparent 70%),radial-gradient(38% 34% at 16% 86%,rgba(169,181,161,.16),transparent 70%);animation:mDrift 14s ease-in-out infinite alternate}
.m-hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,252,248,.11),transparent);animation:mSheen 1.5s .55s var(--ease) 1 backwards}
.m-dot{animation:mDot 2.6s ease-out infinite}
}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#F8F6F2;overflow:hidden;display:flex;flex-direction:column"><div style="padding:62px 20px 0"><div style="display:flex;align-items:center;justify-content:space-between;height:44px"><a href="More.dc.html" style="display:flex;align-items:center;height:44px;margin-left:-8px;padding-right:12px;font-size:17px;color:#9A5A6C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg>More</a></div><div style="font-family:'Fraunces',Georgia,serif;font-size:34px;line-height:1.05;letter-spacing:-0.015em;font-weight:500;color:#242321;margin-top:6px">Help and support</div><div style="font-size:15px;line-height:1.4;color:#65625D;margin-top:6px">Quick answers, or talk to a person.</div></div><div class="noscroll" style="flex:1;overflow-y:auto;padding:8px 20px 24px"><div style="display:flex;align-items:center;justify-content:space-between;margin:22px 2px 4px;min-height:32px"><div style="font-size:20px;font-weight:600;letter-spacing:-0.01em">Common questions</div></div><div style="background:#FFFCF8;border:1px solid #ECE7DF;border-radius:24px;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);padding:0;overflow:hidden;"><sc-for list="{{faqs}}" as="q" hint-placeholder-count="6"><div style="border-bottom:1px solid #F0ECE5"><button onClick="{{q.tap}}" aria-expanded="{{q.open}}" style="width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:60px"><span style="flex:1;font-size:16px;font-weight:600;line-height:1.3">{{q.title}}</span><span style="transform:rotate({{q.rot}});display:inline-flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C8984" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></span></button><sc-if value="{{q.open}}" hint-placeholder-val="{{false}}"><div style="padding:0 16px 16px;font-size:15px;line-height:1.5;color:#4A4743">{{q.text}}</div></sc-if></div></sc-for></div><div style="display:flex;align-items:center;justify-content:space-between;margin:30px 2px 4px;min-height:32px"><div style="font-size:20px;font-weight:600;letter-spacing:-0.01em">Need a person?</div></div><div style="background:#FFFCF8;border:1px solid #ECE7DF;border-radius:24px;box-shadow:0 1px 2px rgba(70,45,30,.05),0 8px 20px -10px rgba(70,45,30,.14);padding:0;overflow:hidden;margin-top:0"><button onClick="{{chat}}" style="width:100%;display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:64px;border-bottom:1px solid #F0ECE5"><span style="width:40px;height:40px;border-radius:14px;background:#EEF2EA;color:#56684F;display:inline-flex;align-items:center;justify-content:center;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19l1.2-3.6A7.5 7.5 0 1 1 9 17.8z"/><path d="M9.5 9c0 3 2 5 5 5.2l1-1.4-1.8-.9-.7.7a3.6 3.6 0 0 1-1.8-1.8l.7-.7-.9-1.8z"/></svg></span><span style="flex:1;min-width:0"><span style="display:block;font-size:16px;font-weight:600">Chat with support</span><span style="display:block;font-size:15px;color:#65625D">{{chatNote}}</span></span></button><button onClick="{{openFb}}" style="width:100%;display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:64px;"><span style="width:40px;height:40px;border-radius:14px;background:#F7ECEE;color:#8A4C5F;display:inline-flex;align-items:center;justify-content:center;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4.5 7.5 7.5 6 7.5-6"/></svg></span><span style="flex:1;min-width:0"><span style="display:block;font-size:16px;font-weight:600">Send feedback</span><span style="display:block;font-size:15px;color:#65625D">Tell us what would help</span></span></button></div></div><sc-if value="{{fbOpen}}" hint-placeholder-val="{{false}}"><div style="position:absolute;inset:0;background:rgba(36,35,33,.38);display:flex;flex-direction:column;justify-content:flex-end;z-index:20" class="m-scrim"><div style="background:#FFFCF8;border-radius:30px 30px 0 0;padding:10px 20px 34px;box-shadow:0 -12px 40px -12px rgba(70,45,30,.25)" class="m-sheet"><div style="width:36px;height:5px;border-radius:3px;background:#D9D4CB;margin:0 auto 14px"></div><div style="font-size:20px;font-weight:600">Send feedback</div><div style="margin-top:14px"><div style="font-size:15px;font-weight:600;color:#65625D;margin:0 2px 6px">What would help?</div><input aria-label="What would help?" placeholder="Write your idea or problem" value="{{fb.value}}" onInput="{{fb.type}}" style="height:52px;border-radius:14px;background:#F4F1EB;border:1.5px solid #E3DED5;padding:0 14px;font-size:16px"></div><div style="margin-top:16px"><button onClick="{{sendFb}}" style="height:56px;border-radius:18px;background:#242321;color:#FFFCF8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 10px 20px -10px rgba(36,35,33,.5);width:100%;">{{fbLabel}}</button></div><button onClick="{{closeFb}}" style="width:100%;height:48px;margin-top:6px;text-align:center;font-size:16px;font-weight:600;color:#65625D">Close</button></div></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sw = (on) => ({ on: on, bg: on ? '#6E8266' : '#D5D0C7', left: on ? '22px' : '2px' });
    const cs = (on) => ({ on: on, bg: on ? '#242321' : '#FFFCF8', fg: on ? '#FFFCF8' : '#242321', bd: on ? '#242321' : '#E3DED5' });

    const defs = [['How do clients book with me?', 'Share your booking link or QR code. Clients choose a service and time in their browser, no app needed. A client profile is created automatically.'], ['Can I use the app without voice?', 'Yes. Choose Write it myself when you register a treatment and fill the fields by hand.'], ['Who can see my clients\' photos?', 'Only you. Photos are private by default and are never saved to your camera roll. You can share one only with the client\'s OK.'], ['Does Bello Hub take payments?', 'No. Bello Hub shows your service prices only if you choose to, and never handles money between you and your clients.'], ['How do I delete a client\'s data?', 'Open Privacy and security, then Delete a client\'s data. Export a copy first if you need one.'], ['Terms of use and privacy policy', 'Bello Hub keeps client information private to your workspace and never sells it. The full terms and privacy policy are available on our website.']];
    const open = st.open;
    const faqs = defs.map((d, i) => ({ title: d[0], text: d[1], open: open === i, rot: open === i ? '90deg' : '0deg', tap: () => this.setState({ open: open === i ? -1 : i }) }));
    return { faqs: faqs, chat: () => this.setState({ chat: true }), chatNote: st.chat ? 'Opening WhatsApp with our team...' : 'Usually answers within a few hours',
      fbOpen: !!st.fbOpen, openFb: () => this.setState({ fbOpen: true, sent: false }), closeFb: () => this.setState({ fbOpen: false }),
      fb: { value: st.fb || '', type: (e) => this.setState({ fb: e.target.value }) }, fbLabel: st.sent ? 'Thank you' : 'Send', sendFb: () => this.setState({ sent: true }) };
  }
}
</script>
</body>
